<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Bugle Classgroom</title>
  <style>
    body, html {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden; /* prevents page scrolling */
      font-family: Arial, sans-serif; /* add nice font */
      background: linear-gradient(135deg, #74ebd5, #9face6); /* gradient background */
    }

    #loginContainer {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 300px; /* fixed width prevents horizontal shifts */
      background: white; /* container background */
      padding: 2rem; /* spacing inside */
      border-radius: 12px; /* rounded corners */
      box-shadow: 0 4px 20px rgba(0,0,0,0.2); /* subtle shadow */
      text-align: center; /* center text inside */
    }

    #loginContainer h2 {
      margin-bottom: 1rem;
      color: #333;
    }

    #loginContainer input {
      width: 100%;
      padding: 10px;
      margin: 8px 0;
      border: 1px solid #ccc;
      border-radius: 6px;
      font-size: 14px;
      box-sizing: border-box;
    }

    #loginContainer button {
      width: 100%;
      padding: 10px;
      background: #4CAF50;
      border: none;
      border-radius: 6px;
      color: white;
      font-size: 16px;
      cursor: pointer;
      margin-top: 10px;
    }
    #createAccountBtn {
      width: 100%;
      padding: 8px;
      background: #2196F3;
      border: none;
      border-radius: 6px;
      color: white;
      font-size: 14px;
      cursor: pointer;
      margin-top: 8px;
    }

    #createAccountBtn:hover {
      background: #1976D2;
    }


    #loginContainer button:hover {
      background: #45a049;
    }

    canvas { display: block; }
  </style>
</head>
<body>
    <div id="crosshair" style="
    position: fixed;
    top: 50%;
    left: 50%;
    width: 10px;
    height: 10px;
    margin-left: -5px;
    margin-top: -5px;
    background: white;
    border-radius: 50%;
    z-index: 1000;
    pointer-events: none;
    display: none;">
  </div>
  <div id="loginContainer">
    <h2>Login</h2>
    <form id="loginForm">
      <input type="text" id="username" placeholder="Username" required>
      <input type="password" id="password" placeholder="Password" required>
      <input type="text" id ='screenName' placeholder="Screen Name">
      <button onclick="sendInfo(event)">Enter Game</button>
      <button type="button" onclick="createAccount(event)" id="createAccountBtn">Create Account</button>
    </form>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>
  <script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@<version>/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@<version>/examples/jsm/"
  }
}
</script>
  <!-- <script src="https://cdn.jsdelivr.net/npm/three@0.160.0/examples/js/utils/BufferGeometryUtils.js"></script> -->
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
  <script type="module" src="/main.js">
  </script>
</body>
</html>
