<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Bugle Classgroom - Less Rigid Edition</title>
  <style>
    body { margin: 0; overflow: hidden; }
    canvas { display: block; }
    #crosshair {
      position: fixed;
      top: 50%; left: 50%;
      width: 10px; height: 10px;
      margin-left: -5px; margin-top: -5px;
      background: white; border-radius: 50%;
      z-index: 1000; pointer-events: none;
      display: none;
    }
  </style>
</head>
<body>
<div id="crosshair"></div>
<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script>
/* --- Firebase Setup --- */
const firebaseConfig = {
  apiKey: "AIzaSyDsQeMfBn2nOlSd_tZk9IdXZI8UEKa5Jx0",
  authDomain: "ftmsim-1a621.firebaseapp.com",
  databaseURL: "https://ftmsim-1a621-default-rtdb.firebaseio.com",
  projectId: "ftmsim-1a621",
  storageBucket: "ftmsim-1a621.appspot.com",
  messagingSenderId: "385792152429",
  appId: "1:385792152429:web:bfe02db3608e4ec9988064"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.database();
const playerId = "player_" + Math.random().toString(36).substring(2, 10);
const playerRef = db.ref('players/' + playerId);

/* --- Player Setup --- */
const screenName = prompt("Enter your screen name:") || "Player";
const colorChoices = [0x0077ff, 0xff4444, 0x44ff44, 0xffcc00, 0x00cccc];
const playerColor = colorChoices[Math.floor(Math.random()*colorChoices.length)];
playerRef.set({ x: 0, y: 0, z: 0, screenName, color: playerColor });
playerRef.onDisconnect().remove();

const otherPlayers = {};

/* --- THREE.js Scene Setup --- */
const scene = new THREE.Scene();
scene.background = new THREE.Color(0xa0d0ff);
const camera = new THREE.PerspectiveCamera(75, window.innerWidth/window.innerHeight, 0.1, 1000);
const renderer = new THREE.WebGLRenderer({antialias:true});
renderer.setSize(window.innerWidth, window.innerHeight);
document.body.appendChild(renderer.domElement);

const ambientLight = new THREE.AmbientLight(0xffffff, 0.7);
scene.add(ambientLight);
const dirLight = new THREE.DirectionalLight(0xffffff, 0.6);
dirLight.position.set(10, 20, 10);
scene.add(dirLight);

/* --- Helper Functions --- */
function makePlatform(x, y, z, w, d, h, color=0x00ff00, moving=false, moveAxis='x', moveRange=3, moveSpeed=1) {
  const plat = new THREE.Mesh(
    new THREE.BoxGeometry(w, h, d),
    new THREE.MeshStandardMaterial({ color })
  );
  plat.position.set(x, y, z);
  plat.userData = { moving, moveAxis, moveRange, moveSpeed, base: x };
  scene.add(plat);
  return plat;
}
function makeBouncer(x, y, z, radius=1, color=0xff00ff) {
  const mesh = new THREE.Mesh(
    new THREE.CylinderGeometry(radius, radius, 0.2, 32),
    new THREE.MeshStandardMaterial({ color })
  );
  mesh.position.set(x, y, z);
  mesh.userData.isBouncer = true;
  scene.add(mesh);
  return mesh;
}
function makePowerup(x, y, z) {
  const mesh = new THREE.Mesh(
    new THREE.IcosahedronGeometry(0.4, 1),
    new THREE.MeshStandardMaterial({ color: 0xffff00, emissive: 0xffee00 })
  );
  mesh.position.set(x, y, z);
  mesh.userData.isPowerup = true;
  scene.add(mesh);
  return mesh;
}
function createNameTag(name) {
  const canvas = document.createElement('canvas');
  const ctx = canvas.getContext('2d');
  canvas.width = 256; canvas.height = 64;
  ctx.fillStyle = 'white'; ctx.fillRect(0, 0, canvas.width, canvas.height);
  ctx.fillStyle = 'black'; ctx.font = '24px Arial'; ctx.textAlign = 'center';
  ctx.fillText(name, canvas.width/2, canvas.height/2 + 8);
  const texture = new THREE.CanvasTexture(canvas);
  const material = new THREE.SpriteMaterial({ map: texture });
  const sprite = new THREE.Sprite(material);
  sprite.scale.set(2, 0.5, 1); sprite.position.y = 3;
  return sprite;
}

/* --- Player Model --- */
function createPlayer(color=0x0077ff) {
  const group = new THREE.Group();
  const torso = new THREE.Mesh(new THREE.BoxGeometry(1, 1.5, 0.5), new THREE.MeshStandardMaterial({ color }));
  torso.position.y = 1.5;
  group.add(torso);
  const head = new THREE.Mesh(new THREE.BoxGeometry(0.6, 0.6, 0.6), new THREE.MeshStandardMaterial({ color: 0xffcc99 }));
  head.position.y = 2.4;
  group.add(head);
  const leftArm = new THREE.Mesh(new THREE.BoxGeometry(0.3, 1.2, 0.3), new THREE.MeshStandardMaterial({ color }));
  leftArm.position.set(-0.65, 1.5, 0);
  const rightArm = leftArm.clone();
  rightArm.position.x = 0.65;
  group.add(leftArm, rightArm);
  const legMaterial = new THREE.MeshStandardMaterial({ color: 0x333333 });
  const leftLeg = new THREE.Mesh(new THREE.BoxGeometry(0.4, 2.3, 0.4), legMaterial);
  leftLeg.position.set(-0.3, 0.3, 0);
  const rightLeg = leftLeg.clone();
  rightLeg.position.x = 0.3;
  group.add(leftLeg, rightLeg);
  group.userData = { leftArm, rightArm, leftLeg, rightLeg, walkTime: 0 };
  return group;
}
const player = createPlayer(playerColor);
player.position.set(0, 2, 0);
scene.add(player);
const nameTag = createNameTag(screenName);
player.add(nameTag);

/* --- Platforms & Level --- */
const platforms = [];
platforms.push(makePlatform(0, 0, 0, 20, 20, 1, 0x00bbff)); // Main ground
platforms.push(makePlatform(5, 3, 0, 4, 4, 0.5, 0x00ff00, true, 'z', 2, 1.2)); // Moving
platforms.push(makePlatform(-5, 5, 5, 3, 3, 0.5, 0xff8800, true, 'x', 3, 0.8)); // Moving
platforms.push(makePlatform(8, 7, -4, 2, 2, 0.5, 0x00ff00));
platforms.push(makePlatform(-8, 9, 6, 2, 2, 0.5, 0x00ff00));
platforms.push(makePlatform(0, 12, 0, 6, 2, 0.5, 0x00ff00));
// Bouncers
const bouncers = [
  makeBouncer(5, 3.3, 0),
  makeBouncer(-5, 5.3, 5)
];
// Random powerup
let powerup = makePowerup(0, 13, 0);

/* --- Bullets --- */
class Bullet {
  constructor(position, direction, color) {
    const geometry = new THREE.SphereGeometry(0.13, 8, 8);
    const material = new THREE.MeshStandardMaterial({ color });
    this.mesh = new THREE.Mesh(geometry, material);
    this.mesh.position.copy(position);
    this.velocity = direction.clone().multiplyScalar(0.7);
    scene.add(this.mesh);
    this.life = 0;
  }
  update() {
    this.mesh.position.add(this.velocity);
    this.life += 1;
  }
}
const bullets = [];
document.addEventListener('mousedown', () => {
  const direction = new THREE.Vector3();
  camera.getWorldDirection(direction);
  const position = player.position.clone().add(new THREE.Vector3(0, 1.5, 0));
  const color = [0xffff00, 0xff0000, 0x00ff00, 0x00ffff][Math.floor(Math.random()*4)];
  bullets.push(new Bullet(position, direction, color));
});

/* --- Controls & Camera --- */
const keys = {};
let yaw = 0, pitch = 0;
let velocity = new THREE.Vector3();
let onGround = false;
let canJump = true, jumpBuffer = 0;
let jumpPower = 0.16, gravity = -0.012;
let moveSpeed = 0.035, friction = 0.83;
let powerupTimer = 0;
document.addEventListener('keydown', e => keys[e.key.toLowerCase()] = true);
document.addEventListener('keyup', e => keys[e.key.toLowerCase()] = false);
document.body.addEventListener('click', () => renderer.domElement.requestPointerLock());
document.addEventListener('pointerlockchange', () => {
  if (document.pointerLockElement === renderer.domElement)
    document.addEventListener('mousemove', onMouseMove, false);
  else
    document.removeEventListener('mousemove', onMouseMove, false);
});
function onMouseMove(event) {
  yaw -= event.movementX * 0.002;
  pitch -= event.movementY * 0.002;
  pitch = Math.max(-Math.PI / 2 + 0.1, Math.min(Math.PI / 2 - 0.1, pitch));
}

/* --- Main Animation Loop --- */
function animate() {
  requestAnimationFrame(animate);

  // Moving platforms
  platforms.forEach(plat => {
    if (plat.userData.moving) {
      const t = Date.now() * plat.userData.moveSpeed * 0.0004;
      if (plat.userData.moveAxis === 'x')
        plat.position.x = plat.userData.base + Math.sin(t) * plat.userData.moveRange;
      else
        plat.position.z = plat.userData.base + Math.cos(t) * plat.userData.moveRange;
    }
  });

  // Player movement (acceleration, friction)
  let input = new THREE.Vector3();
  if (keys['w']) input.z -= 1;
  if (keys['s']) input.z += 1;
  if (keys['a']) input.x -= 1;
  if (keys['d']) input.x += 1;
  input.normalize();
  // Rotate input by yaw
  const move = new THREE.Vector3(
    input.x * Math.cos(yaw) - input.z * Math.sin(yaw),
    0,
    input.x * Math.sin(yaw) + input.z * Math.cos(yaw)
  );
  velocity.x += move.x * moveSpeed;
  velocity.z += move.z * moveSpeed;
  velocity.x *= friction;
  velocity.z *= friction;

  // Gravity and jump
  velocity.y += gravity;
  if (onGround) {
    velocity.y = Math.max(velocity.y, 0);
    if (keys[' '] && canJump) {
      velocity.y = jumpPower;
      canJump = false;
      jumpBuffer = 6; // Jump buffer frames
      spawnJumpParticles(player.position);
    }
  } else {
    if (keys[' ']) jumpBuffer = 6;
    if (jumpBuffer > 0 && onGround) {
      velocity.y = jumpPower;
      jumpBuffer = 0;
      spawnJumpParticles(player.position);
    }
    jumpBuffer = Math.max(0, jumpBuffer-1);
  }
  if (!keys[' ']) canJump = true;

  // Move player
  player.position.add(velocity);

  // Collision with platforms (simple AABB)
  onGround = false;
  platforms.forEach(plat => {
    const px = player.position.x, py = player.position.y, pz = player.position.z;
    const bx = plat.position.x, by = plat.position.y, bz = plat.position.z;
    const bw = plat.geometry.parameters.width/2, bd = plat.geometry.parameters.depth/2, bh = plat.geometry.parameters.height/2;
    if (
      px > bx-bw && px < bx+bw &&
      pz > bz-bd && pz < bz+bd &&
      py-1.0 < by+bh && py-1.0 > by-bh-0.2 &&
      velocity.y <= 0
    ) {
      player.position.y = by+bh+1.01;
      velocity.y = 0;
      onGround = true;
    }
  });

  // Bouncer pads
  bouncers.forEach(bouncer => {
    if (player.position.distanceTo(bouncer.position) < 1.2 && velocity.y < 0.01) {
      velocity.y = jumpPower * 2.1;
      spawnJumpParticles(bouncer.position);
    }
  });

  // Powerup
  if (powerup && player.position.distanceTo(powerup.position) < 1.2) {
    scene.remove(powerup);
    powerup = null;
    powerupTimer = 300; // 5 seconds
    jumpPower = 0.28;
    setTimeout(() => {
      jumpPower = 0.16;
      powerup = makePowerup(-5+Math.random()*10, 13, -5+Math.random()*10);
    }, 5000);
  }

  // Bullets update
  for (let i = bullets.length-1; i >= 0; i--) {
    bullets[i].update();
    if (bullets[i].life > 180) {
      scene.remove(bullets[i].mesh);
      bullets.splice(i, 1);
    }
  }

  // Camera follow
  camera.position.set(
    player.position.x - Math.sin(yaw)*6,
    player.position.y + 3 + Math.sin(pitch)*2,
    player.position.z - Math.cos(yaw)*6
  );
  camera.lookAt(player.position.x, player.position.y+1.2, player.position.z);

  // Send player position to DB
  playerRef.update({ x: player.position.x, y: player.position.y, z: player.position.z });

  renderer.render(scene, camera);
}
animate();

/* --- Multiplayer (show other players) --- */
db.ref('players').on('value', snapshot => {
  const players = snapshot.val() || {};
  for (const id in players) {
    if (id === playerId) continue;
    if (!otherPlayers[id]) {
      const op = createPlayer(players[id].color || 0x0077ff);
      op.position.set(players[id].x, players[id].y, players[id].z);
      op.add(createNameTag(players[id].screenName || "Player"));
      scene.add(op);
      otherPlayers[id] = op;
    } else {
      otherPlayers[id].position.set(players[id].x, players[id].y, players[id].z);
    }
  }
  // Remove disconnected
  for (const id in otherPlayers) {
    if (!players[id]) {
      scene.remove(otherPlayers[id]);
      delete otherPlayers[id];
    }
  }
});

/* --- Particle Effects --- */
function spawnJumpParticles(pos) {
  for (let i=0; i<8; i++) {
    const p = new THREE.Mesh(
      new THREE.SphereGeometry(0.08, 6, 6),
      new THREE.MeshStandardMaterial({ color: 0xffffff, transparent:true, opacity:0.7 })
    );
    p.position.copy(pos);
    const dir = new THREE.Vector3(
      Math.random()-0.5, Math.random()*1.2, Math.random()-0.5
    ).normalize().multiplyScalar(0.4+Math.random()*0.3);
    let life = 0;
    function updateParticle() {
      p.position.add(dir);
      p.material.opacity -= 0.04;
      life++;
      if (life > 15) {
        scene.remove(p);
      } else {
        requestAnimationFrame(updateParticle);
      }
    }
    scene.add(p);
    updateParticle();
  }
}

/* --- Responsive Resize --- */
window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth/window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});
</script>
</body>
</html>
