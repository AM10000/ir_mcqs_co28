    function makeFloorGeometry(x, z, floorNum) {
      const parts = [];
	  const mainBlock = [];
      // NOTE: args: (x, z, y, sx, sz, sy, color)
      function addBox(px, py, pz, sx, sz, sy, color) {
        // map your convention -> Three.js convention
        const geom = new THREE.BoxGeometry(sz, sy, sx);
        geom.translate(px, py, pz); // (x, y, z) in Three.js
        // geom.userData = { color };
		if (color == 0xfaf398) {
			parts.push(geom);
		} else {
			mainBlock.push(geom);
		}
        
      }

      // === converted layout ===
      addBox(x, floorNum*5 + 2.5, z, 9, 9, 5, 0x466078); // Main Block
      addBox(x, floorNum*5 + 0.5, z+4.75, 0.5, 10, 1, 0xfaf398); // A back
      addBox(x, floorNum*5 + 0.5, z-4.75, 0.5, 10, 1, 0xfaf398); // A front
      addBox(x, floorNum*5 + 4.5, z-4.75, 0.5, 10, 1, 0xfaf398); // B front
      addBox(x, floorNum*5 + 4.5, z+4.75, 0.5, 10, 1, 0xfaf398); // B back

      addBox(x+4.5, floorNum*5 + 2.5, z-4.75, 0.5, 1, 3, 0xfaf398); // C front
      addBox(x+4.5, floorNum*5 + 2.5, z+4.75, 0.5, 1, 3, 0xfaf398); // C back
      addBox(x-4.5, floorNum*5 + 2.5, z-4.75, 0.5, 1, 3, 0xfaf398); // F front
      addBox(x-4.5, floorNum*5 + 2.5, z+4.75, 0.5, 1, 3, 0xfaf398); // F back

      addBox(x+1.5, floorNum*5 + 2.5, z-4.75, 0.5, 1, 3, 0xfaf398); // D front
      addBox(x+1.5, floorNum*5 + 2.5, z+4.75, 0.5, 1, 3, 0xfaf398); // D back
      addBox(x-1.5, floorNum*5 + 2.5, z-4.75, 0.5, 1, 3, 0xfaf398); // E front
      addBox(x-1.5, floorNum*5 + 2.5, z+4.75, 0.5, 1, 3, 0xfaf398); // E back

      addBox(x-4.75, floorNum*5 + 0.5, z, 10, 0.5, 1, 0xfaf398); // A right
      addBox(x+4.75, floorNum*5 + 0.5, z, 10, 0.5, 1, 0xfaf398); // A left
      addBox(x-4.75, floorNum*5 + 4.5, z, 10, 0.5, 1, 0xfaf398); // B right
      addBox(x+4.75, floorNum*5 + 4.5, z, 10, 0.5, 1, 0xfaf398); // B left

      addBox(x-4.75, floorNum*5 + 2.5, z+4.5, 1, 0.5, 3, 0xfaf398); // C right
      addBox(x+4.75, floorNum*5 + 2.5, z+4.5, 1, 0.5, 3, 0xfaf398); // C left
      addBox(x-4.75, floorNum*5 + 2.5, z-4.5, 1, 0.5, 3, 0xfaf398); // F right
      addBox(x+4.75, floorNum*5 + 2.5, z-4.5, 1, 0.5, 3, 0xfaf398); // F left

      addBox(x-4.75, floorNum*5 + 2.5, z+1.5, 1, 0.5, 3, 0xfaf398); // D right
      addBox(x+4.75, floorNum*5 + 2.5, z+1.5, 1, 0.5, 3, 0xfaf398); // D left
      addBox(x-4.75, floorNum*5 + 2.5, z-1.5, 1, 0.5, 3, 0xfaf398); // E right
      addBox(x+4.75, floorNum*5 + 2.5, z-1.5, 1, 0.5, 3, 0xfaf398); // E left

      return [parts, mainBlock];
    }

      const skyscraperMain = new THREE.Mesh(mergedGeometryMain, materialMain);
      scene.add(skyscraperParts);

      list.push(skyscraperMain);

    skyscrapers.push(skyscraperMain);

    function createNameTag(name) {
      const canvas = document.createElement('canvas');
      const context = canvas.getContext('2d');
      canvas.width = 256;
      canvas.height = 64;

      context.fillStyle = 'white';
      context.fillRect(0, 0, canvas.width, canvas.height);
      context.fillStyle = 'black';
      context.font = '24px Arial';
      context.textAlign = 'center';
      context.fillText(name, canvas.width / 2, canvas.height / 2 + 8);

      const texture = new THREE.CanvasTexture(canvas);
      const material = new THREE.SpriteMaterial({ map: texture });
      const sprite = new THREE.Sprite(material);
      sprite.scale.set(2, 0.5, 1); // Adjust size
      sprite.position.y = 3; // Position above the avatar's head
      return sprite;
    }

    function updateBotX(bot, player, speed) {
      // Vector from bot → player
      const toPlayer = new THREE.Vector3().subVectors(player.position, bot.position);

      // Flatten to XZ plane (ignore vertical difference if you want ground movement only)
      toPlayer.y = 0;
      toPlayer.normalize();

      // Move bot toward player
      // bot.position.add(toPlayer.multiplyScalar(speed));
      bot.position.x+=toPlayer.x*speed;

      // Make bot face player (rotate toward player)
      bot.lookAt(player.position.x, bot.position.y, player.position.z);
    }
    function updateBotZ(bot, player, speed) {
      // Vector from bot → player
      const toPlayer = new THREE.Vector3().subVectors(player.position, bot.position);

      // Flatten to XZ plane (ignore vertical difference if you want ground movement only)
      toPlayer.y = 0;
      toPlayer.normalize();

      // Move bot toward player
      // bot.position.add(toPlayer.multiplyScalar(speed));
      bot.position.z+=toPlayer.z*speed;

      // Make bot face player (rotate toward player)
      bot.lookAt(player.position.x, bot.position.y, player.position.z);
    }

      const movementX = event.movementX || 0;

      pitch = Math.max(-Math.PI / 2 + 0.1, Math.min(Math.PI / 2 - 0.1, pitch));

    function onTouchMove(event) {
      const nowX = event.touches[0].clientX || 0;
      const nowY = event.touches[0].clientY || 0;
      const movementX=nowX-startX;
      const movementY=nowY-startY;
      startX=nowX;
      startY=nowY;
      yaw -= movementX * 0.002;

      pitch = Math.max(-Math.PI / 2 + 0.1, Math.min(Math.PI / 2 - 0.1, pitch));

            for (let i = 0; i < 20; i+=2){
              makePlatform(toStrikeXAuto, toStrikezAuto, 3+(2.598076211*i), 0.5, 0.5, 3, scene, lightningsTimed[lightningTicks], 0xfcfc03, 1.0, -Math.PI/6);
              makePlatform(toStrikeXAuto, toStrikezAuto, 3+(2.598076211*(i+1)), 0.5, 0.5, 3, scene, lightningsTimed[lightningTicks], 0xfcfc03, 1.0, Math.PI/6);
            }
            ticksToDestroy=-1;
          }
          for (const t in lightningsTimed) {
            if (lightningTicks-t >= 10) {
              for (const seg of lightningsTimed[t]) {
                scene.remove(seg);
              }
              delete lightningsTimed[t];
            }
          }
        }
        if (gameTicks>=nextSpawnTick){
          makeBot(195, 125, scene, bots);
          makeBot(165, 125, scene, bots);
          makeBot(145, 125, scene, bots);
          makeBot(115, 125, scene, bots);
          makeBot(95, 125, scene, bots);
          makeBot(75, 125, scene, bots);
          makeBot(205, 105, scene, bots);
          makeBot(175, 105, scene, bots);
          makeBot(125, 105, scene, bots);
          makeBot(95, 105, scene, bots);
          makeBot(175, 85, scene, bots);
          makeBot(115, 85, scene, bots);
          makeBot(145, 75, scene, bots);
          makeBot(105, 65, scene, bots);
          makeBot(75, 65, scene, bots);
          makeBot(195, 55, scene, bots);
          makeBot(145, 55, scene, bots);
          makeBot(155, 45, scene, bots);
          makeBot(105, 45, scene, bots);
          makeBot(175, 35, scene, bots);
          makeBot(55, 35, scene, bots);
          makeBot(145, 25, scene, bots);
          makeBot(195, 15, scene, bots);
          makeBot(115, 15, scene, bots);
          makeBot(75, 15, scene, bots);
          makeBot(135, 5, scene, bots);
          makeBot(55, 5, scene, bots);
          makeBot(185, -5, scene, bots);
          makeBot(155, -5, scene, bots);
          makeBot(195, -15, scene, bots);
          makeBot(95, -15, scene, bots);
          makeBot(135, -25, scene, bots);
          makeBot(65, -25, scene, bots);
          makeBot(175, -35, scene, bots);
          nextSpawnTick+=500;
        }
        if (player.position.x > 50 && !inCity){
          makeCity();
          inCity=true;
        } else if (player.position.x <= 50) {
          inCity=false;
          for (const s of skyscrapers){
            scene.remove(s);
          }
        }
        for (let i = bots.length - 1; i >= 0; i--) {
          let b = bots[i];
          let bOldPosition = b.mesh.position.clone();
          updateBotX(b.mesh, player, 0.1);
          let botBoxObj = new THREE.Box3().setFromObject(b.mesh);
          for (const p of platforms) {
            var bboxobj = new THREE.Box3().setFromObject(p);
            if (botBoxObj.intersectsBox(bboxobj)) {
              b.mesh.position.x=bOldPosition.x;
              break;
            }
          }
          updateBotZ(b.mesh, player, 0.1);
          botBoxObj = new THREE.Box3().setFromObject(b.mesh);
          for (const p of platforms) {
            var bboxobj = new THREE.Box3().setFromObject(p);
            if (botBoxObj.intersectsBox(bboxobj)) {
              b.mesh.position.z=bOldPosition.z;
              break;
            }
          }
          b.age++;
          if (b.age >= 500) {
            scene.remove(b.mesh);
            bots.splice(i, 1);
          }
        }

        const lookDirection = new THREE.Vector3(
        Math.sin(yaw) * Math.cos(pitch),
        Math.sin(pitch),
        Math.cos(yaw) * Math.cos(pitch)
        );

        // Player should face the same direction as camera
        player.rotation.y = yaw + Math.PI;
        // if (inCar) {
        //   car.rotation.z = yaw+Math.PI/2;
        // }


        const isFirstPerson = zoomDistance < 2;

        if (isFirstPerson) {
          crosshair.style.display='block';
          const eyeOffset = new THREE.Vector3(0, 1.7, 0);
          const cameraPosition = player.position.clone().add(eyeOffset);
          camera.position.copy(cameraPosition);
          camera.lookAt(cameraPosition.clone().add(lookDirection));

          // Hide body in first-person
          player.traverse(child => {
              if (child.isMesh) child.visible = false;
          });
          player.healthBar.sprite.visible=false;


        } else {
          crosshair.style.display='none';
          player.healthBar.sprite.visible=true;
          // if (!inCar){
            const cameraPosition = player.position.clone().sub(lookDirection.clone().multiplyScalar(zoomDistance));
            cameraPosition.y += 2;
            camera.position.copy(cameraPosition);
            camera.lookAt(player.position.clone().add(new THREE.Vector3(0, 1, 0)));

            // Show body in third-person
            player.traverse(child => {
                if (child.isMesh) child.visible = true;
            });
          // } else {
          //   const cameraPosition = car.position.clone().add(new THREE.Vector3(-1.25, 0, 1.75)).sub(lookDirection.clone().multiplyScalar(zoomDistance));
          //   cameraPosition.y += 2;
          //   camera.position.copy(cameraPosition);
          //   camera.lookAt(car.position.clone().add(new THREE.Vector3(-1.25, 0, 1.75)).add(new THREE.Vector3(0, 1, 0)));
          // }
        }



        const isMoving = direction.lengthSq() > 0.0001;
        if (isMoving) player.userData.walkTime += 0.2;
        else player.userData.walkTime = 0;

        const swing = Math.sin(player.userData.walkTime) * 0.5;
        player.userData.leftArm.rotation.x = swing;
        player.userData.rightArm.rotation.x = -swing;
        player.userData.leftLeg.rotation.x = -swing;
        player.userData.rightLeg.rotation.x = swing;


        // Update bullets positions
        updateBullets();

        // Collision between bullets and other players or self
        bullets.forEach((bullet, bulletIndex) => {
            // Check collision with other players
            let bboxBullet = new THREE.Box3().setFromObject(bullet.mesh);
            for (const id in otherPlayers) {
            const other = otherPlayers[id];
              if (bullet.mesh.position.distanceTo(other.position) < 1) {
                // Decrease health of other player on hit
                if (typeof other.health === 'undefined') other.health = 100; // safety check
                other.health -= 10;
                updateHealthBar(other);
                // Remove bullet
                scene.remove(bullet.mesh);
                bullets.splice(bulletIndex, 1);
                db.ref('players/' + id).update({health:other.health});
                break;
              }
            }
            // Check collision with local player (friendly fire possible)
            if (bullet.mesh.position.distanceTo(player.position) < 1) {
                player.health -= 10;
                if (player.health <= 0){
                  player.health=100;
                  player.position.set(0, 3, 0);
                  onGround=True;
                }
                updateHealthBar(player);
                scene.remove(bullet.mesh);
                bullets.splice(bulletIndex, 1);
            }

            for (const p of platforms){
              let bboxplat = new THREE.Box3().setFromObject(p);
              if (bboxBullet.intersectsBox(bboxplat)){
                scene.remove(bullet.mesh);
                bullets.splice(bulletIndex, 1);
                break;
              }
            }
            for (let i = bots.length - 1; i >= 0; i--) {
              let b = bots[i];
              let bboxBot = new THREE.Box3().setFromObject(b.mesh);
              if (bboxBullet.intersectsBox(bboxBot)){
                scene.remove(bullet.mesh);
                bullets.splice(bulletIndex, 1);
                scene.remove(b.mesh);
                bots.splice(i, 1);
              }
            }
        });
        if (player.health <= 0){
          player.health=100;
          player.position.set(0, 3, 0);
          onGround=True;
        }

        renderer.render(scene, camera);

        // Update local player position in Firebase
        if (player.health !== lastHealth) {
            playerRef.update({
                x: player.position.x,
                y: player.position.y,
                z: player.position.z,
                health: player.health,
            });
            lastHealth = player.health;
        } else {
            playerRef.update({
                x: player.position.x,
                y: player.position.y,
                z: player.position.z,
                // health: player.health
            });
        }

    }
let admin = null;
let auth = null;
playerRef.child("Achievements").on("value", snapshot => {
  markersFound = snapshot.val().split(', ');
  playerRef.onDisconnect().update({ Achievements: markersFound.join(', ') });
  playerRef.child("Achievements").remove();
});
playerRef.child("admin").on("value", snapshot => {
  admin = snapshot.val();
  checkStart();
});

playerRef.child("auth").on("value", snapshot => {
  auth = snapshot.val();
  checkStart();
});

db.ref('lightning').on('value', snapshot => {
  const data = snapshot.val() || {};
  for (const id in data) {
    if (!lightnings[id]) {
      lightnings[id]=[];
      for (let i = 0; i < 20; i+=2){
        makePlatform(data[id].x, data[id].z, 3+(2.598076211*i), 0.5, 0.5, 3, scene, lightnings[id], 0xfcfc03, 1.0, -Math.PI/6);
        makePlatform(data[id].x, data[id].z, 3+(2.598076211*(i+1)), 0.5, 0.5, 3, scene, lightnings[id], 0xfcfc03, 1.0, Math.PI/6);
      }
    }
  }

  for (const id in lightnings) {
    if (!data[id]){
      for (const lin of lightnings[id]) {
        scene.remove(lin);
      }
      delete lightnings[id];
    }
  }
});

function checkStart() {
  if (!started && admin != null && auth === true) {
    started = true;
    document.getElementById('loginContainer').style.display='none';
    animate();
  } else if (auth === false && !started) {
    alert("Incorrect username or password. If you created an account, your username is already taken.");
  }
}

 db.ref('players').on('value', snapshot => {
  const data = snapshot.val() || {};
  for (const id in data) {
    const pdata = data[id];
    if (id === playerId) {
      player.position.set(pdata.x, pdata.y, pdata.z);
      if (typeof pdata.health === 'number') {
        player.health = pdata.health;
        updateHealthBar(player);
      }
      // Do NOT overwrite player.health here to avoid losing local health changes
    } else {
      // For other players, update position and health fully from Firebase
      if (!otherPlayers[id]) {
        const newPlayer = createPlayer(0xff0000, pdata.admin||false);
        newPlayer.health = pdata.health ?? 100;
        createHealthBar(newPlayer);
        updateHealthBar(newPlayer);

        const nameTag = createNameTag(pdata.screenName || 'Player');
        nameTag.name = 'nameTag'; // set identifiable name
        newPlayer.add(nameTag);

        scene.add(newPlayer);
        otherPlayers[id] = newPlayer;
      }

      const other = otherPlayers[id];
      other.position.set(pdata.x, pdata.y, pdata.z);

      // Update name tag text only if it changed
      const existingTag = other.getObjectByName('nameTag');
      if (existingTag && existingTag.element && existingTag.element.innerText !== pdata.screenName) {
        existingTag.element.innerText = pdata.screenName || 'Player';
      }

      if (typeof pdata.health === 'number') {
        other.health = pdata.health;
        updateHealthBar(other);
      }

    }
  }

  // Remove disconnected players...

      // Remove players who left
      for (const id in otherPlayers) {
        if (!data[id]) {
          scene.remove(otherPlayers[id]);
          delete otherPlayers[id];
        }
      }
    });
  </script>
