<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Bugle Classgroom</title>
  <style>
    body { margin: 0; overflow: hidden; }
    canvas { display: block; }
  </style>
</head>
<body>
  <script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>
  <script>
    function makePlatform(x, y, z, height, width, depth, scene, platformList, color=0x00ff00) {
        const platform = new THREE.Mesh(
            new THREE.BoxGeometry(width, depth, height),
            new THREE.MeshStandardMaterial({ color: color })
        );
        platform.position.set(x, z, y);
        scene.add(platform);
        platformList.push(platform);
    };
    let zoomDistance = 6;

  const scene = new THREE.Scene();
  scene.background = new THREE.Color(0xa0d0ff);

  const camera = new THREE.PerspectiveCamera(75, window.innerWidth/window.innerHeight, 0.1, 1000);
  const renderer = new THREE.WebGLRenderer();
  renderer.setSize(window.innerWidth, window.innerHeight);
  document.body.appendChild(renderer.domElement);

  const light = new THREE.DirectionalLight(0xffffff, 1);
  light.position.set(10, 20, 10);
  scene.add(light);
  scene.add(new THREE.AmbientLight(0x404040));

  const platforms = [];
  const platformMaterial = new THREE.MeshStandardMaterial({ color: 0x00ff00 });

  for (let i = 1; i < 5; i++) {
    makePlatform(0, i, i, 1, 3, 0.5, scene, platforms, color=0x000dff);
  }
  makePlatform(0, 0, 0, 10000, 10000, 0.5, scene, platforms);
  makePlatform(0, 6, 5, 3, 3, 0.5, scene, platforms, color=0x000dff);
  for (let i=1; i<5; i++) {
    makePlatform(-i-1, 6, i+5, 3, 1, 0.5, scene, platforms, color=0x000dff);
  }
const player = new THREE.Group();

const torso = new THREE.Mesh(
  new THREE.BoxGeometry(1, 1.5, 0.5),
  new THREE.MeshStandardMaterial({ color: 0x0077ff })
);
torso.position.y = 1.5;
player.add(torso);

const head = new THREE.Mesh(
  new THREE.BoxGeometry(0.6, 0.6, 0.6),
  new THREE.MeshStandardMaterial({ color: 0xffcc99 })
);
head.position.y = 2.4;
player.add(head);

const armMaterial = new THREE.MeshStandardMaterial({ color: 0x0077ff });
const leftArm = new THREE.Mesh(new THREE.BoxGeometry(0.3, 1.2, 0.3), armMaterial);
const rightArm = leftArm.clone();

leftArm.position.set(-0.65, 1.5, 0);
rightArm.position.set(0.65, 1.5, 0);
player.add(leftArm, rightArm);

const legMaterial = new THREE.MeshStandardMaterial({ color: 0x333333 });
const leftLeg = new THREE.Mesh(new THREE.BoxGeometry(0.4, 2.3, 0.4), legMaterial);
const rightLeg = leftLeg.clone();

leftLeg.position.set(-0.3, 0.3, 0);
rightLeg.position.set(0.3, 0.3, 0);
player.add(leftLeg, rightLeg);

player.position.set(0, 0, 0);
player.scale.set(0.6, 0.6, 0.6);
scene.add(player);
player.userData = {
  leftArm,
  rightArm,
  leftLeg,
  rightLeg,
  walkTime: 0
};



  let velocityY = 0;
  let onGround = false;
  const keys = {};
  document.addEventListener('keydown', e => keys[e.key.toLowerCase()] = true);
  document.addEventListener('keyup', e => keys[e.key.toLowerCase()] = false);

  let yaw = 0;
  let pitch = 0;

  document.body.addEventListener('click', () => {
    renderer.domElement.requestPointerLock();
  });

  document.addEventListener('pointerlockchange', () => {
    if (document.pointerLockElement === renderer.domElement) {
      document.addEventListener('mousemove', onMouseMove, false);
    } else {
      document.removeEventListener('mousemove', onMouseMove, false);
    }
  });

  function onMouseMove(event) {
    const movementX = event.movementX || 0;
    const movementY = event.movementY || 0;
    yaw -= movementX * 0.002;
    pitch -= movementY * 0.002;

    pitch = Math.max(-Math.PI / 2 + 0.1, Math.min(Math.PI / 2 - 0.1, pitch));
  }
  document.addEventListener('wheel', (event) => {
    zoomDistance += event.deltaY * 0.01; // scroll up = zoom out, down = zoom in
    zoomDistance = Math.max(2, Math.min(15, zoomDistance)); // clamp between 2 and 15
  });

  function animate() {
    requestAnimationFrame(animate);

    const direction = new THREE.Vector3();
    const speed = 0.1;

    if (keys['w']) direction.z -= 1;
    if (keys['s']) direction.z += 1;
    if (keys['a']) direction.x -= 1;
    if (keys['d']) direction.x += 1;

    const yawOnly = new THREE.Euler(0, yaw, 0);
    direction.applyEuler(new THREE.Euler(0, yaw + Math.PI, 0));



    player.position.x += direction.x * speed;
    player.position.z += direction.z * speed;

    velocityY -= 0.01;
    player.position.y += velocityY;


    onGround = false;
    platforms.forEach(p => {
      const px = Math.abs(player.position.x - p.position.x) < p.geometry.parameters.width/2;
      const pz = Math.abs(player.position.z - p.position.z) < p.geometry.parameters.depth/2;
      const py = Math.abs(player.position.y - p.position.y) < p.geometry.parameters.height*2;

      if (px && pz && py && velocityY < 0) {
        velocityY = 0;
        player.position.y = p.position.y + 0.75;
        onGround = true;
      }
    });

    if (keys[' '] && onGround) velocityY = 0.22;

    const cameraDistance = 6;
    const cameraHeight = 2;

    const lookDirection = new THREE.Vector3(
    Math.sin(yaw) * Math.cos(pitch),
    Math.sin(pitch),
    Math.cos(yaw) * Math.cos(pitch)
    );

    const cameraPosition = player.position.clone().sub(lookDirection.clone().multiplyScalar(zoomDistance));
    player.rotation.y = yaw + Math.PI;

    cameraPosition.y += cameraHeight;
    camera.position.copy(cameraPosition);

    camera.lookAt(player.position.clone().add(new THREE.Vector3(0, 1, 0)));

    // Walking animation
const isMoving = direction.lengthSq() > 0.0001;
if (isMoving) {
  player.userData.walkTime += 0.2; // control walk speed
} else {
  player.userData.walkTime = 0;
}

const swing = Math.sin(player.userData.walkTime) * 0.5;

player.userData.leftArm.rotation.x = swing;
player.userData.rightArm.rotation.x = -swing;
player.userData.leftLeg.rotation.x = -swing;
player.userData.rightLeg.rotation.x = swing;

    renderer.render(scene, camera);
  }

  animate();
</script>

  </script>
</body>
</html>
