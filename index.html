<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Bugle Classgroom</title>
  <style>
    body, html {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #74ebd5, #9face6);
    }
    #loginContainer {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 300px;
      background: white;
      padding: 2rem;
      border-radius: 12px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.2);
      text-align: center;
    }
    #loginContainer h2 { margin-bottom: 1rem; color: #333; }
    #loginContainer input {
      width: 100%; padding: 10px; margin: 8px 0;
      border: 1px solid #ccc; border-radius: 6px;
      font-size: 14px; box-sizing: border-box;
    }
    #loginContainer button {
      width: 100%; padding: 10px; background: #4CAF50;
      border: none; border-radius: 6px; color: white;
      font-size: 16px; cursor: pointer; margin-top: 10px;
    }
    #createAccountBtn {
      width: 100%; padding: 8px; background: #2196F3;
      border: none; border-radius: 6px; color: white;
      font-size: 14px; cursor: pointer; margin-top: 8px;
    }
    #createAccountBtn:hover { background: #1976D2; }
    #loginContainer button:hover { background: #45a049; }
    #toggleContainer {
      position: absolute; top: 10px; left: 10px;
      background: rgba(0,0,0,0.5); color: white;
      padding: 8px 12px; border-radius: 8px;
      font-family: sans-serif; z-index: 10;
    }
    input[type="checkbox"] { transform: scale(1.3); margin-right: 8px; }
    canvas { display: block; }
  </style>
</head>

    function makePlatform(x, y, z, height, width, depth, scene, platformList, color = 0x00ff00, opacity = 1.0, rotx = 0, roty = 0, rotz = 0, ret = false) {
        const loader = new THREE.TextureLoader();
        let imagePath;
        if(color === 0x00ff00) { imagePath = 'download.jpeg'; }
        else if (color === 0x737373) { imagePath = 'rocks.jpeg'; }
        else if (color === 0x00fff7) { imagePath = 'portal.jpeg'; }
        else { imagePath = 'studs.jpeg'; }
        loader.load(imagePath, (baseTexture) => {
            baseTexture.wrapS = THREE.RepeatWrapping;
            baseTexture.wrapT = THREE.RepeatWrapping;
            const boxWidth = width;
            const boxHeight = depth;
            const boxDepth = height;
            const textureScale = 2;
            const faceSizes = [
                [boxDepth, boxHeight],[boxDepth, boxHeight],
                [boxWidth, boxDepth],[boxWidth, boxDepth],
                [boxWidth, boxHeight],[boxWidth, boxHeight],
            ];
            const materials = faceSizes.map(([fw, fh]) => {
                const tex = baseTexture.clone();
                tex.repeat.set(fw / textureScale, fh / textureScale);
                return new THREE.MeshStandardMaterial({ color, transparent: opacity < 1, opacity, map: tex });
            });
            const platform = new THREE.Mesh(new THREE.BoxGeometry(boxWidth, boxHeight, boxDepth), materials);
            platform.position.set(x, z, y);
            platform.rotation.x = rotx;
            platform.rotation.y = rotz;
            platform.rotation.z = roty;
            platform.castShadow = true;
            platform.receiveShadow = true;
            scene.add(platform);
            if (!ret){ platformList.push(platform); } else { return platform; }
        });
    }

        updateBullets();
        bullets.forEach((bullet, bulletIndex) => {
            let bboxBullet = new THREE.Box3().setFromObject(bullet.mesh);
            for (const id in otherPlayers) {
              const other = otherPlayers[id];
              if (bullet.mesh.position.distanceTo(other.position) < 1) {
                if (typeof other.health === 'undefined') other.health = 100;
                other.health -= 10;
                updateHealthBar(other);
                scene.remove(bullet.mesh);
                bullets.splice(bulletIndex, 1);
                db.ref('players/' + id).update({health: other.health});
                break;
              }
            }
            if (bullet.mesh.position.distanceTo(player.position) < 1) {
                player.health -= 10;
                if (player.health <= 0){ player.health = 100; player.position.set(0, 3, 0); onGround = true; }
                updateHealthBar(player);
                scene.remove(bullet.mesh);
                bullets.splice(bulletIndex, 1);
            }
            for (const p of platforms){
              let bboxplat = new THREE.Box3().setFromObject(p);
              if (bboxBullet.intersectsBox(bboxplat)){
                scene.remove(bullet.mesh); bullets.splice(bulletIndex, 1); break;
              }
            }
            for (let i = bots.length - 1; i >= 0; i--) {
              let b = bots[i];
              let bboxBot = new THREE.Box3().setFromObject(b.mesh);
              if (bboxBullet.intersectsBox(bboxBot)){
                scene.remove(bullet.mesh); bullets.splice(bulletIndex, 1);
                scene.remove(b.mesh); bots.splice(i, 1);
              }
            }
        });
        if (player.health <= 0){ player.health = 100; player.position.set(0, 3, 0); onGround = true; }
        renderer.render(scene, camera);
        if (player.health !== lastHealth) {
            playerRef.update({ x: player.position.x, y: player.position.y, z: player.position.z, health: player.health });
            lastHealth = player.health;
        } else {
            playerRef.update({ x: player.position.x, y: player.position.y, z: player.position.z });
        }
    }

    let admin = null;
    let auth = null;
    playerRef.child("Achievements").on("value", snapshot => {
      markersFound = snapshot.val().split(', ');
      playerRef.onDisconnect().update({ Achievements: markersFound.join(', ') });
      playerRef.update({ achrcv: true });
      playerRef.child("Achievements").remove();
    });
    playerRef.child("admin").on("value", snapshot => { admin = snapshot.val(); checkStart(); });
    playerRef.child("auth").on("value", snapshot => { auth = snapshot.val(); checkStart(); });
    db.ref('lightning').on('value', snapshot => {
      const data = snapshot.val() || {};
      for (const id in data) {
        if (!lightnings[id]) {
          lightnings[id] = [];
          for (let i = 0; i < 20; i+=2){
            makePlatform(data[id].x, data[id].z, 3+(2.598076211*i), 0.5, 0.5, 3, scene, lightnings[id], 0xfcfc03, 1.0, -Math.PI/6);
            makePlatform(data[id].x, data[id].z, 3+(2.598076211*(i+1)), 0.5, 0.5, 3, scene, lightnings[id], 0xfcfc03, 1.0, Math.PI/6);
          }
        }
      }
      for (const id in lightnings) {
        if (!data[id]){
          for (const lin of lightnings[id]) { scene.remove(lin); }
          delete lightnings[id];
        }
      }
    });
    function checkStart() {
      if (!started && admin != null && auth === true) {
        playerRef.child("ip").once('value').then((snapshot)=>{
          if(snapshot.exists()){
            if (localStorage.getItem("fakeIP") == snapshot.val()){
              started = true;
              document.getElementById('loginContainer').style.display = 'none';
              animate();
            } else { alert("Bad IP"); }
          }
        });
      } else if (auth === false && !started) {
        alert("Incorrect username or password. If you created an account, your username is already taken.");
      }
    }
    db.ref('players').on('value', snapshot => {
      const data = snapshot.val() || {};
      for (const id in data) {
        const pdata = data[id];
        if (id === playerId) {
          player.position.set(pdata.x, pdata.y, pdata.z);
          if (typeof pdata.health === 'number') { player.health = pdata.health; updateHealthBar(player); }
        } else if (data[id].world === 'spawn') {
          if (!otherPlayers[id]) {
            const newPlayer = createPlayer(0xff0000, pdata.admin||false);
            newPlayer.health = pdata.health ?? 100;
            createHealthBar(newPlayer);
            updateHealthBar(newPlayer);
            const nameTag = createNameTag(pdata.screenName || 'Player');
            nameTag.name = 'nameTag';
            newPlayer.add(nameTag);
            scene.add(newPlayer);
            otherPlayers[id] = newPlayer;
          }
          const other = otherPlayers[id];
          other.position.set(pdata.x, pdata.y, pdata.z);
          const existingTag = other.getObjectByName('nameTag');
          if (existingTag && existingTag.element && existingTag.element.innerText !== pdata.screenName) {
            existingTag.element.innerText = pdata.screenName || 'Player';
          }
          if (typeof pdata.health === 'number') { other.health = pdata.health; updateHealthBar(other); }
        }
      }

      // ── FIXED: only remove a player from the scene if they are truly gone
      // from Firebase OR have moved to a different world. Previously the three
      // separate if-blocks could crash with a null-ref when data[id] existed
      // but world was briefly unset during a world transition.
      for (const id in otherPlayers) {
        if (!data[id] || data[id].world === 'boss' || data[id].world === 'city') {
          scene.remove(otherPlayers[id]);
          delete otherPlayers[id];
        }
      }
    });
  </script>
</body>
</html>
