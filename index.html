<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Bugle Classgroom</title>
  <style>
    body { margin: 0; overflow: hidden; }
    canvas { display: block; }
  </style>
</head>
<body>
  <script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>
  <script>
    function makePlatform(x, y, z, height, width, depth, scene, platformList) {
        const platform = new THREE.Mesh(
            new THREE.BoxGeometry(width, depth, height),
            platformMaterial
        );
        platform.position.set(x, z, y);
        scene.add(platform);
        platformList.push(platform);
    };
    let zoomDistance = 6;

  const scene = new THREE.Scene();
  scene.background = new THREE.Color(0xa0d0ff);

  const camera = new THREE.PerspectiveCamera(75, window.innerWidth/window.innerHeight, 0.1, 1000);
  const renderer = new THREE.WebGLRenderer();
  renderer.setSize(window.innerWidth, window.innerHeight);
  document.body.appendChild(renderer.domElement);

  const light = new THREE.DirectionalLight(0xffffff, 1);
  light.position.set(10, 20, 10);
  scene.add(light);
  scene.add(new THREE.AmbientLight(0x404040));

  const platforms = [];
  const platformMaterial = new THREE.MeshStandardMaterial({ color: 0x00ff00 });

  for (let i = 0; i < 5; i++) {
    makePlatform(i*5, i*5, i*2, 4, 4, 0.5, scene, platforms);
  }

  const player = new THREE.Mesh(
    new THREE.BoxGeometry(1, 1, 1),
    new THREE.MeshStandardMaterial({ color: 0xff0000 })
  );
  player.position.set(0, 1, 0);
  scene.add(player);

  let velocityY = 0;
  let onGround = false;
  const keys = {};
  document.addEventListener('keydown', e => keys[e.key.toLowerCase()] = true);
  document.addEventListener('keyup', e => keys[e.key.toLowerCase()] = false);

  let yaw = 0;
  let pitch = 0;

  document.body.addEventListener('click', () => {
    renderer.domElement.requestPointerLock();
  });

  document.addEventListener('pointerlockchange', () => {
    if (document.pointerLockElement === renderer.domElement) {
      document.addEventListener('mousemove', onMouseMove, false);
    } else {
      document.removeEventListener('mousemove', onMouseMove, false);
    }
  });

  function onMouseMove(event) {
    const movementX = event.movementX || 0;
    const movementY = event.movementY || 0;
    yaw -= movementX * 0.002;
    pitch -= movementY * 0.002;

    pitch = Math.max(-Math.PI / 2 + 0.1, Math.min(Math.PI / 2 - 0.1, pitch));
  }
  document.addEventListener('wheel', (event) => {
    zoomDistance += event.deltaY * 0.01; // scroll up = zoom out, down = zoom in
    zoomDistance = Math.max(2, Math.min(15, zoomDistance)); // clamp between 2 and 15
  });

  function animate() {
    requestAnimationFrame(animate);

    const direction = new THREE.Vector3();
    const speed = 0.1;

    if (keys['w']) direction.z -= 1;
    if (keys['s']) direction.z += 1;
    if (keys['a']) direction.x -= 1;
    if (keys['d']) direction.x += 1;

    const yawOnly = new THREE.Euler(0, yaw, 0);
    direction.applyEuler(new THREE.Euler(0, yaw + Math.PI, 0));



    player.position.x += direction.x * speed;
    player.position.z += direction.z * speed;

    velocityY -= 0.01;
    player.position.y += velocityY;


    onGround = false;
    platforms.forEach(p => {
      const px = Math.abs(player.position.x - p.position.x) < 2;
      const pz = Math.abs(player.position.z - p.position.z) < 2;
      const py = Math.abs(player.position.y - p.position.y) < 1;

      if (px && pz && py && velocityY < 0) {
        velocityY = 0;
        player.position.y = p.position.y + 0.75;
        onGround = true;
      }
    });

    if (keys[' '] && onGround) velocityY = 0.15;

    const cameraDistance = 6;
    const cameraHeight = 2;

    const lookDirection = new THREE.Vector3(
    Math.sin(yaw) * Math.cos(pitch),
    Math.sin(pitch),
    Math.cos(yaw) * Math.cos(pitch)
    );

    const cameraPosition = player.position.clone().sub(lookDirection.clone().multiplyScalar(zoomDistance));

    cameraPosition.y += cameraHeight;
    camera.position.copy(cameraPosition);

    camera.lookAt(player.position.clone().add(new THREE.Vector3(0, 1, 0)));


    renderer.render(scene, camera);
  }

  animate();
</script>

  </script>
</body>
</html>
