        function loadQuestions() {
            const blocks = questionsText.trim().split(/\n\s*\n/);
            let quizContainer = document.getElementById('quiz-container');
            quizContainer.innerHTML = '';

            blocks.forEach((block, index) => {
                let lines = block.trim().split('\n');
                let questionText = lines[0];
                let options = lines.slice(1);

                let questionDiv = document.createElement('div');
                questionDiv.classList.add('question');
                questionDiv.innerHTML = `<p><strong>${questionText}</strong></p>`;

                let optionsList = document.createElement('ul');
                optionsList.classList.add('options');

                options.forEach((option, idx) => {
                    let li = document.createElement('li');
                    li.innerHTML = `<label><input type="radio" name="q${index}" value="${String.fromCharCode(97 + idx)}"> ${option.trim()}</label>`;
                    optionsList.appendChild(li);
                });

                questionDiv.appendChild(optionsList);
                quizContainer.appendChild(questionDiv);
            });
        }

        function checkAnswers() {
            let score = 0;
            answerKey.forEach((correctAnswer, index) => {
                let selected = document.querySelector(`input[name="q${index}"]:checked`);
                if (selected && selected.value === correctAnswer) {
                    score++;
                }
            });
            let result = document.getElementById('result');
            result.textContent = `You scored ${score} out of ${answerKey.length}.`;
        }

        loadQuestions();
    </script>
