<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Bugle Classroom - Realistic & Classic</title>
  <style>
    body { margin: 0; overflow: hidden; }
    canvas { display: block; }
    #crosshair {
      position: fixed;
      top: 50%; left: 50%;
      width: 10px; height: 10px;
      margin-left: -5px; margin-top: -5px;
      background: white; border-radius: 50%;
      z-index: 1000; pointer-events: none;
      display: none;
    }
  </style>
</head>
<body>
<div id="crosshair"></div>
<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script>
/* --- Firebase Setup --- */
const firebaseConfig = {
  apiKey: "AIzaSyDsQeMfBn2nOlSd_tZk9IdXZI8UEKa5Jx0",
  authDomain: "ftmsim-1a621.firebaseapp.com",
  databaseURL: "https://ftmsim-1a621-default-rtdb.firebaseio.com",
  projectId: "ftmsim-1a621",
  storageBucket: "ftmsim-1a621.appspot.com",
  messagingSenderId: "385792152429",
  appId: "1:385792152429:web:bfe02db3608e4ec9988064"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.database();
const playerId = "player_" + Math.random().toString(36).substring(2, 10);
const playerRef = db.ref('players/' + playerId);

/* --- Player Setup --- */
const screenName = prompt("Enter your screen name:") || "Player";
const colorChoices = [0x0077ff, 0xff4444, 0x44ff44, 0xffcc00, 0x00cccc];
const playerColor = colorChoices[Math.floor(Math.random()*colorChoices.length)];
playerRef.set({ x: 0, y: 0, z: 0, screenName, color: playerColor });
playerRef.onDisconnect().remove();

const otherPlayers = {};

/* --- THREE.js Scene Setup --- */
const scene = new THREE.Scene();
scene.background = new THREE.Color(0xa0d0ff);
const camera = new THREE.PerspectiveCamera(75, window.innerWidth/window.innerHeight, 0.1, 1000);
const renderer = new THREE.WebGLRenderer({antialias:true});
renderer.setSize(window.innerWidth, window.innerHeight);
document.body.appendChild(renderer.domElement);

const ambientLight = new THREE.AmbientLight(0xffffff, 0.7);
scene.add(ambientLight);
const dirLight = new THREE.DirectionalLight(0xffffff, 0.6);
dirLight.position.set(10, 20, 10);
scene.add(dirLight);

/* --- Helper Functions --- */
function makePlatform(x, y, z, w, d, h, color=0x00ff00) {
  const plat = new THREE.Mesh(
    new THREE.BoxGeometry(w, h, d),
    new THREE.MeshStandardMaterial({ color })
  );
  plat.position.set(x, y, z);
  scene.add(plat);
  return plat;
}
function makeObstacle(x, y, z, w, h, d, color=0x555555) {
  const obs = new THREE.Mesh(
    new THREE.BoxGeometry(w, h, d),
    new THREE.MeshStandardMaterial({ color })
  );
  obs.position.set(x, y, z);
  obs.userData.isObstacle = true;
  scene.add(obs);
  return obs;
}
function createNameTag(name) {
  const canvas = document.createElement('canvas');
  const ctx = canvas.getContext('2d');
  canvas.width = 256; canvas.height = 64;
  ctx.fillStyle = 'white'; ctx.fillRect(0, 0, canvas.width, canvas.height);
  ctx.fillStyle = 'black'; ctx.font = '24px Arial'; ctx.textAlign = 'center';
  ctx.fillText(name, canvas.width/2, canvas.height/2 + 8);
  const texture = new THREE.CanvasTexture(canvas);
  const material = new THREE.SpriteMaterial({ map: texture });
  const sprite = new THREE.Sprite(material);
  sprite.scale.set(2, 0.5, 1); sprite.position.y = 3.2;
  return sprite;
}

/* --- More Realistic Player Model --- */
function createPlayer(color=0x0077ff) {
  const group = new THREE.Group();

  // Torso
  const torso = new THREE.Mesh(
    new THREE.BoxGeometry(0.7, 1.2, 0.4),
    new THREE.MeshStandardMaterial({ color })
  );
  torso.position.y = 1.5;
  group.add(torso);

  // Head (sphere for realism)
  const head = new THREE.Mesh(
    new THREE.SphereGeometry(0.35, 24, 16),
    new THREE.MeshStandardMaterial({ color: 0xffe0bd })
  );
  head.position.y = 2.3;
  group.add(head);

  // Face (simple eyes and mouth)
  const faceCanvas = document.createElement('canvas');
  faceCanvas.width = 64; faceCanvas.height = 64;
  const faceCtx = faceCanvas.getContext('2d');
  faceCtx.fillStyle = "#ffe0bd";
  faceCtx.fillRect(0,0,64,64);
  faceCtx.fillStyle = "#222";
  faceCtx.beginPath(); faceCtx.arc(20,30,5,0,2*Math.PI); faceCtx.fill();
  faceCtx.beginPath(); faceCtx.arc(44,30,5,0,2*Math.PI); faceCtx.fill();
  faceCtx.strokeStyle = "#222"; faceCtx.lineWidth = 3;
  faceCtx.beginPath(); faceCtx.arc(32,44,10,0,Math.PI); faceCtx.stroke();
  const faceTexture = new THREE.CanvasTexture(faceCanvas);
  const faceMat = new THREE.MeshBasicMaterial({ map: faceTexture });
  const facePlane = new THREE.Mesh(new THREE.PlaneGeometry(0.32, 0.32), faceMat);
  facePlane.position.set(0,2.33,0.36);
  group.add(facePlane);

  // Arms (cylinders for realism)
  const armGeo = new THREE.CylinderGeometry(0.13, 0.13, 0.9, 12);
  const armMat = new THREE.MeshStandardMaterial({ color });
  const leftArm = new THREE.Mesh(armGeo, armMat);
  leftArm.position.set(-0.5, 1.6, 0);
  leftArm.rotation.z = Math.PI/8;
  group.add(leftArm);
  const rightArm = new THREE.Mesh(armGeo, armMat);
  rightArm.position.set(0.5, 1.6, 0);
  rightArm.rotation.z = -Math.PI/8;
  group.add(rightArm);

  // Hands (spheres)
  const handGeo = new THREE.SphereGeometry(0.15, 12, 8);
  const handMat = new THREE.MeshStandardMaterial({ color: 0xffe0bd });
  const leftHand = new THREE.Mesh(handGeo, handMat);
  leftHand.position.set(-0.5, 1.15, 0);
  group.add(leftHand);
  const rightHand = new THREE.Mesh(handGeo, handMat);
  rightHand.position.set(0.5, 1.15, 0);
  group.add(rightHand);

  // Legs (cylinders)
  const legGeo = new THREE.CylinderGeometry(0.16, 0.16, 1.2, 12);
  const legMat = new THREE.MeshStandardMaterial({ color: 0x333333 });
  const leftLeg = new THREE.Mesh(legGeo, legMat);
  leftLeg.position.set(-0.22, 0.3, 0);
  group.add(leftLeg);
  const rightLeg = new THREE.Mesh(legGeo, legMat);
  rightLeg.position.set(0.22, 0.3, 0);
  group.add(rightLeg);

  // Feet (boxes)
  const footGeo = new THREE.BoxGeometry(0.22, 0.12, 0.35);
  const footMat = new THREE.MeshStandardMaterial({ color: 0x222222 });
  const leftFoot = new THREE.Mesh(footGeo, footMat);
  leftFoot.position.set(-0.22, -0.35, 0.09);
  group.add(leftFoot);
  const rightFoot = new THREE.Mesh(footGeo, footMat);
  rightFoot.position.set(0.22, -0.35, 0.09);
  group.add(rightFoot);

  group.userData = { leftArm, rightArm, leftLeg, rightLeg };
  return group;
}
const player = createPlayer(playerColor);
player.position.set(0, 2, 0);
scene.add(player);
const nameTag = createNameTag(screenName);
player.add(nameTag);

/* --- Platforms & Obstacles (Original Layout) --- */
const platforms = [];
platforms.push(makePlatform(0, 0, 0, 20, 20, 1, 0x00bbff)); // Main ground
platforms.push(makePlatform(0, 2, -6, 3, 3, 0.5, 0x00ff00));
platforms.push(makePlatform(0, 4, -12, 3, 3, 0.5, 0x00ff00));
platforms.push(makePlatform(0, 6, -18, 3, 3, 0.5, 0x00ff00));
platforms.push(makePlatform(0, 8, -24, 3, 3, 0.5, 0x00ff00));
platforms.push(makePlatform(0, 10, -30, 3, 3, 0.5, 0x00ff00));
platforms.push(makePlatform(0, 12, -36, 3, 3, 0.5, 0x00ff00));
platforms.push(makePlatform(0, 14, -42, 6, 6, 0.5, 0x00ff00));
platforms.push(makePlatform(0, 16, -48, 8, 8, 0.5, 0x00ff00));

// Obstacles (walls, cubes, etc.)
const obstacles = [];
obstacles.push(makeObstacle(0, 3, -9, 1, 2, 1));
obstacles.push(makeObstacle(-1.2, 5, -15, 1, 2, 1));
obstacles.push(makeObstacle(1.2, 7, -21, 1, 2, 1));
obstacles.push(makeObstacle(0, 9, -27, 1.5, 2, 1.5));
obstacles.push(makeObstacle(-1.5, 11, -33, 1, 2, 1));
obstacles.push(makeObstacle(1.5, 13, -39, 1, 2, 1));
obstacles.push(makeObstacle(0, 15, -45, 2, 2, 2));

// Add a finish flag
const flagGeo = new THREE.CylinderGeometry(0.15, 0.15, 2, 16);
const flagMat = new THREE.MeshStandardMaterial({ color: 0xff4444 });
const flag = new THREE.Mesh(flagGeo, flagMat);
flag.position.set(0, 17, -48);
scene.add(flag);

/* --- Bullets --- */
class Bullet {
  constructor(position, direction, color) {
    const geometry = new THREE.SphereGeometry(0.13, 8, 8);
    const material = new THREE.MeshStandardMaterial({ color });
    this.mesh = new THREE.Mesh(geometry, material);
    this.mesh.position.copy(position);
    this.velocity = direction.clone().multiplyScalar(0.7);
    scene.add(this.mesh);
    this.life = 0;
  }
  update() {
    this.mesh.position.add(this.velocity);
    this.life += 1;
  }
}
const bullets = [];
document.addEventListener('mousedown', () => {
  const direction = new THREE.Vector3();
  camera.getWorldDirection(direction);
  const position = player.position.clone().add(new THREE.Vector3(0, 1.5, 0));
  const color = [0xffff00, 0xff0000, 0x00ff00, 0x00ffff][Math.floor(Math.random()*4)];
  bullets.push(new Bullet(position, direction, color));
});

/* --- Controls & Camera --- */
const keys = {};
let yaw = 0, pitch = 0;
let velocity = new THREE.Vector3();
let onGround = false;
let canJump = true, jumpBuffer = 0;
let jumpPower = 0.16, gravity = -0.012;
let moveSpeed = 0.035, friction = 0.83;

document.addEventListener('keydown', e => keys[e.key.toLowerCase()] = true);
document.addEventListener('keyup', e => keys[e.key.toLowerCase()] = false);
document.body.addEventListener('click', () => renderer.domElement.requestPointerLock());
document.addEventListener('pointerlockchange', () => {
  if (document.pointerLockElement === renderer.domElement)
    document.addEventListener('mousemove', onMouseMove, false);
  else
    document.removeEventListener('mousemove', onMouseMove, false);
});
function onMouseMove(event) {
  yaw -= event.movementX * 0.002;
  pitch -= event.movementY * 0.002;
  pitch = Math.max(-Math.PI / 2 + 0.1, Math.min(Math.PI / 2 - 0.1, pitch));
}

/* --- Main Animation Loop --- */
function animate() {
  requestAnimationFrame(animate);

  // Player movement (acceleration, friction)
  let input = new THREE.Vector3();
  if (keys['w']) input.z -= 1;
  if (keys['s']) input.z += 1;
  if (keys['a']) input.x -= 1;
  if (keys['d']) input.x += 1;
  input.normalize();
  // Rotate input by yaw
  const move = new THREE.Vector3(
    input.x * Math.cos(yaw) - input.z * Math.sin(yaw),
    0,
    input.x * Math.sin(yaw) + input.z * Math.cos(yaw)
  );
  velocity.x += move.x * moveSpeed;
  velocity.z += move.z * moveSpeed;
  velocity.x *= friction;
  velocity.z *= friction;

  // Gravity and jump
  velocity.y += gravity;
  if (onGround) {
    velocity.y = Math.max(velocity.y, 0);
    if (keys[' '] && canJump) {
      velocity.y = jumpPower;
      canJump = false;
      jumpBuffer = 6; // Jump buffer frames
      spawnJumpParticles(player.position);
    }
  } else {
    if (keys[' ']) jumpBuffer = 6;
    if (jumpBuffer > 0 && onGround) {
      velocity.y = jumpPower;
      jumpBuffer = 0;
      spawnJumpParticles(player.position);
    }
    jumpBuffer = Math.max(0, jumpBuffer-1);
  }
  if (!keys[' ']) canJump = true;

  // Move player
  player.position.add(velocity);

  // Collision with platforms (simple AABB)
  onGround = false;
  platforms.forEach(plat => {
    const px = player.position.x, py = player.position.y, pz = player.position.z;
    const bx = plat.position.x, by = plat.position.y, bz = plat.position.z;
    const bw = plat.geometry.parameters.width/2, bd = plat.geometry.parameters.depth/2, bh = plat.geometry.parameters.height/2;
    if (
      px > bx-bw && px < bx+bw &&
      pz > bz-bd && pz < bz+bd &&
      py-1.0 < by+bh && py-1.0 > by-bh-0.2 &&
      velocity.y <= 0
    ) {
      player.position.y = by+bh+1.01;
      velocity.y = 0;
      onGround = true;
    }
  });

  // Collision with obstacles (stop movement)
  obstacles.forEach(obs => {
    const px = player.position.x, py = player.position.y, pz = player.position.z;
    const bx = obs.position.x, by = obs.position.y, bz = obs.position.z;
    const bw = obs.geometry.parameters.width/2, bd = obs.geometry.parameters.depth/2, bh = obs.geometry.parameters.height/2;
    if (
      px > bx-bw-0.4 && px < bx+bw+0.4 &&
      py > by-bh-1.0 && py < by+bh+1.0 &&
      pz > bz-bd-0.4 && pz < bz+bd+0.4
    ) {
      // Push player out on the smallest axis
      const dx = Math.abs(px-bx)-bw-0.4;
      const dy = Math.abs(py-by)-bh-1.0;
      const dz = Math.abs(pz-bz)-bd-0.4;
      if (dx < dy && dx < dz) {
        player.position.x += (px > bx ? 1 : -1) * (Math.abs(dx)+0.01);
        velocity.x = 0;
      } else if (dz < dx && dz < dy) {
        player.position.z += (pz > bz ? 1 : -1) * (Math.abs(dz)+0.01);
        velocity.z = 0;
      } else {
        player.position.y += (py > by ? 1 : -1) * (Math.abs(dy)+0.01);
        velocity.y = 0;
      }
    }
  });

  // Bullets update
  for (let i = bullets.length-1; i >= 0; i--) {
    bullets[i].update();
    if (bullets[i].life > 180) {
      scene.remove(bullets[i].mesh);
      bullets.splice(i, 1);
    }
  }

  // Camera movement (original style: third-person, follows behind and above)
  const camOffset = new THREE.Vector3(0, 2.5, 5);
  camOffset.applyAxisAngle(new THREE.Vector3(0,1,0), yaw);
  camera.position.copy(player.position).add(camOffset);
  camera.lookAt(player.position.x, player.position.y+1.2, player.position.z);

  // Send player position to DB
  playerRef.update({ x: player.position.x, y: player.position.y, z: player.position.z });

  renderer.render(scene, camera);
}
animate();

/* --- Multiplayer (show other players) --- */
db.ref('players').on('value', snapshot => {
  const players = snapshot.val() || {};
  for (const id in players) {
    if (id === playerId) continue;
    if (!otherPlayers[id]) {
      const op = createPlayer(players[id].color || 0x0077ff);
      op.position.set(players[id].x, players[id].y, players[id].z);
      op.add(createNameTag(players[id].screenName || "Player"));
      scene.add(op);
      otherPlayers[id] = op;
    } else {
      otherPlayers[id].position.set(players[id].x, players[id].y, players[id].z);
    }
  }
  // Remove disconnected
  for (const id in otherPlayers) {
    if (!players[id]) {
      scene.remove(otherPlayers[id]);
      delete otherPlayers[id];
    }
  }
});

/* --- Particle Effects --- */
function spawnJumpParticles(pos) {
  for (let i=0; i<8; i++) {
    const p = new THREE.Mesh(
      new THREE.SphereGeometry(0.08, 6, 6),
      new THREE.MeshStandardMaterial({ color: 0xffffff, transparent:true, opacity:0.7 })
    );
    p.position.copy(pos);
    const dir = new THREE.Vector3(
      Math.random()-0.5, Math.random()*1.2, Math.random()-0.5
    ).normalize().multiplyScalar(0.4+Math.random()*0.3);
    let life = 0;
    function updateParticle() {
      p.position.add(dir);
      p.material.opacity -= 0.04;
      life++;
      if (life > 15) {
        scene.remove(p);
      } else {
        requestAnimationFrame(updateParticle);
      }
    }
    scene.add(p);
    updateParticle();
  }
}

/* --- Responsive Resize --- */
window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth/window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});
</script>
</body>
</html>
