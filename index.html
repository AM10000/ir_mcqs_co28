<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Bugle Classgroom</title>
  <style>
    body { margin: 0; overflow: hidden; }
    canvas { display: block; }
  </style>
</head>
<body>
  <script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>
  <script>
    // import { OrbitControls } from 'https://cdn.jsdelivr.net/npm/three/addons/controls/OrbitControls.js';
    function makePlatform(x, y, z, height, width, depth, scene, platformList) {
        const platform = new THREE.Mesh(
            new THREE.BoxGeometry(width, depth, height),
            platformMaterial
        );
        platform.position.set(x, z, y);
        scene.add(platform);
        platformList.push(platform);
    };
    
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0xa0d0ff);

    const camera = new THREE.PerspectiveCamera(75, window.innerWidth/window.innerHeight, 0.1, 1000);
    function moveCamera() {
      camera.rotation.y=event.clientX;
    };
    const renderer = new THREE.WebGLRenderer();
    renderer.setSize(window.innerWidth, window.innerHeight);
    document.body.appendChild(renderer.domElement);
    const light = new THREE.DirectionalLight(0xffffff, 1);
    light.position.set(10, 20, 10);
    scene.add(light);
    // const controls = new OrbitControls(camera, renderer.domElement);
    camera.position.set(0, 20, 50);
    // controls.update();
    const ambient = new THREE.AmbientLight(0x404040);
    scene.add(ambient);
    const platformMaterial = new THREE.MeshStandardMaterial({ color: 0x00ff00 });
    const platforms = [];

    for (let i = 0; i < 7; i++) {
        makePlatform(i*5, i*5, i*2, 4, 4, 0.5, scene, platforms);
    }
    const player = new THREE.Mesh(
      new THREE.BoxGeometry(1, 1, 1),
      new THREE.MeshStandardMaterial({ color: 0xff0000 })
    );
    player.position.set(0, 1, 0);
    scene.add(player);
    let velocityY = 0;
    let onGround = false;
    const keys = {};

    document.addEventListener('keydown', e => keys[e.key.toLowerCase()] = true);
    document.addEventListener('keyup', e => keys[e.key.toLowerCase()] = false);
    document.addEventListener('mousemove', moveCamera);
    function animate() {
      requestAnimationFrame(animate);
      if (keys['a']) player.position.x -= 0.1;
      if (keys['d']) player.position.x += 0.1;
      if (keys['w']) player.position.z -= 0.1;
      if (keys['s']) player.position.z += 0.1;
      velocityY -= 0.01;
      player.position.y += velocityY;
      onGround = false;
      platforms.forEach(p => {
        const px = Math.abs(player.position.x - p.position.x) < 2;
        const pz = Math.abs(player.position.z - p.position.z) < 2;
        const py = Math.abs(player.position.y - p.position.y) < 1;

        if (px && pz && py && velocityY < 0) {
          velocityY = 0;
          player.position.y = p.position.y + 0.75;
          onGround = true;
        }
      });

      if (keys[' '] && onGround) {
        velocityY = 0.15;
      }


	    // controls.update();

	    // renderer.render( scene, camera );
      camera.position.x = player.position.x;
      camera.position.z = player.position.z + 10;
      camera.lookAt(player.position);

      renderer.render(scene, camera);
    }

    animate();
  </script>
</body>
</html>
