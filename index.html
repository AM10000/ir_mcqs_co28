<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Bugle Classgroom</title>
  <style>
    body { margin: 0; overflow: hidden; }
    canvas { display: block; }
  </style>
</head>
<body>
  <script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyDsQeMfBn2nOlSd_tZk9IdXZI8UEKa5Jx0",
      authDomain: "ftmsim-1a621.firebaseapp.com",
      databaseURL: "https://ftmsim-1a621-default-rtdb.firebaseio.com",
      projectId: "ftmsim-1a621",
      storageBucket: "ftmsim-1a621.appspot.com",
      messagingSenderId: "385792152429",
      appId: "1:385792152429:web:bfe02db3608e4ec9988064"
    };

    const app = firebase.initializeApp(firebaseConfig);
    const db = firebase.database();
    const playerId = "player_" + Math.random().toString(36).substring(2, 10);
    const playerRef = db.ref('players/' + playerId);

    db.ref('players').once('value').then(snapshot => {
      const players = snapshot.val() || {};
      for (const id in players) {
        if (id !== playerId) {
          db.ref('players/' + id).remove();
        }
      }
    });

    // Set initial position and health for local player -- health integration
    playerRef.set({ x: 0, y: 0, z: 0, health: 100 });
    playerRef.onDisconnect().remove();

    const otherPlayers = {};

    class Bullet {
        constructor(position, direction) {
            const geometry = new THREE.SphereGeometry(0.1, 8, 8);
            const material = new THREE.MeshStandardMaterial({ color: 0xffff00 });
            this.mesh = new THREE.Mesh(geometry, material);
            this.mesh.position.copy(position);
            this.velocity = direction.clone().multiplyScalar(0.5);
            scene.add(this.mesh);
        }

        update() {
            this.mesh.position.add(this.velocity);
        }
    }

    function makePlatform(x, y, z, height, width, depth, scene, platformList, color=0x00ff00) {
        const platform = new THREE.Mesh(
            new THREE.BoxGeometry(width, depth, height),
            new THREE.MeshStandardMaterial({ color: color })
        );
        platform.position.set(x, z, y);
        scene.add(platform);
        platformList.push(platform);
    }
    function makeTorus(x, y, z, radius, tube, radialSegments, tubularSegments, scene, list, color=0x000dff){
      const shape = new THREE.Mesh(
            new THREE.TorusGeometry(radius, tube, radialSegments, tubularSegments),
            new THREE.MeshStandardMaterial({ color: color })
        );
      shape.position.set(x, z, y);
      shape.rotation.x=Math.PI/2;
      scene.add(shape);
      list.push(shape);
    }
    function makeCircle(x, y, z, radius, scene, list, color=0x000dff) {
      const shape = new THREE.Mesh(
            new THREE.CylinderGeometry(radius, radius, 0.1),
            new THREE.MeshStandardMaterial({ color: color })
        );
      shape.position.set(x, z, y);
      // shape.rotation.x=Math.PI/2;
      scene.add(shape);
      list.push(shape);
    }
    let zoomDistance = 6;
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0xa0d0ff);

    const camera = new THREE.PerspectiveCamera(75, window.innerWidth/window.innerHeight, 0.1, 1000);
    const renderer = new THREE.WebGLRenderer();
    renderer.setSize(window.innerWidth, window.innerHeight);
    document.body.appendChild(renderer.domElement);

    const light = new THREE.DirectionalLight(0xffffff, 1);
    light.position.set(10, 20, 10);
    scene.add(light);
    scene.add(new THREE.AmbientLight(0x404040));

    const platforms = [];
    const killBricks = [];
    const rings = [];
    const bouncers=[];
    for (let i = 1; i < 5; i++) {
      makePlatform(0, i, i, 1, 3, 0.5, scene, platforms, color=0x000dff);
    }
    makePlatform(0, 0, 0, 10000, 10000, 0.5, scene, platforms);
    makePlatform(0, 6, 5, 3, 3, 0.5, scene, platforms, color=0x000dff);
    for (let i=1; i<5; i++) {
      makePlatform(-i-1, 6, i+5, 3, 1, 0.5, scene, platforms, color=0x000dff);
    }
    for(let i=1; i<5; i++) {
      if (i%2==1){
        makePlatform(-i*5-5, 6, 9, 3, 3, 0.5, scene, platforms, color=0x000dff);
        makePlatform(-i*5-5, 5, 9.5, 1, 3, 0.5, scene, killBricks, color=0xff0000);
      } else {
        makePlatform(-i*5-5, 6, 9, 3, 3, 0.5, scene, platforms, color=0x000dff);
        makePlatform(-i*5-5, 7, 9.5, 1, 3, 0.5, scene, killBricks, color=0xff0000);
      }
    }
    makePlatform(-34, 6, 9, 7, 10, 0.5, scene, platforms, color=0x000dff);
    makePlatform(-32, 6, 12, 7, 0.5, 10, scene, platforms, color=0x000dff);
    makePlatform(-36, 6, 12, 7, 0.5, 10, scene, platforms, color=0x000dff);
    makeTorus(0, 0, 5, 1, 0.1, 30, 200, scene, rings);
    makeCircle(0, 0, 5, 1, scene, bouncers);

    const bullets = [];

    document.addEventListener('mousedown', () => {
        const direction = new THREE.Vector3();
        camera.getWorldDirection(direction);
        const position = player.position.clone().add(new THREE.Vector3(0, 1.5, 0)); // Adjust as needed
        bullets.push(new Bullet(position, direction));
    });

    function updateBullets() {
        bullets.forEach((bullet, index) => {
            bullet.update();
            // Remove bullets that are too far
            if (bullet.mesh.position.length() > 100) {
            scene.remove(bullet.mesh);
            bullets.splice(index, 1);
            }
        });
    }

    // Health bar creation and update -- health integration
    function createHealthBar(player) {
        const canvas = document.createElement('canvas');
        canvas.width = 128;
        canvas.height = 16;
        const context = canvas.getContext('2d');
        context.fillStyle = 'green';
        context.fillRect(0, 0, 128, 16);
        const texture = new THREE.CanvasTexture(canvas);
        const material = new THREE.SpriteMaterial({ map: texture });
        const sprite = new THREE.Sprite(material);
        sprite.scale.set(2, 0.25, 1);
        sprite.position.set(0, 2.5, 0); // Position above the player's head
        player.add(sprite);
        player.healthBar = { sprite, context, texture };
    }

    function updateHealthBar(player) {
        const { context, texture } = player.healthBar;
        context.clearRect(0, 0, 128, 16);
        context.fillStyle = 'red';
        context.fillRect(0, 0, 128, 16);
        context.fillStyle = 'green';
        context.fillRect(0, 0, (player.health / 100) * 128, 16);
        texture.needsUpdate = true;
    }

    function createPlayer(color = 0x0077ff) {
      const group = new THREE.Group();

      const torso = new THREE.Mesh(new THREE.BoxGeometry(1, 1.5, 0.5), new THREE.MeshStandardMaterial({ color }));
      torso.position.y = 1.5;
      group.add(torso);

      const head = new THREE.Mesh(new THREE.BoxGeometry(0.6, 0.6, 0.6), new THREE.MeshStandardMaterial({ color: 0xffcc99 }));
      head.position.set(0, 2.5, 0);
      group.add(head);

      // Limbs
      const leftArm = new THREE.Mesh(new THREE.BoxGeometry(0.3, 1.2, 0.3), new THREE.MeshStandardMaterial({ color }));
      leftArm.position.set(-0.85, 1.4, 0);
      group.add(leftArm);

      const rightArm = new THREE.Mesh(new THREE.BoxGeometry(0.3, 1.2, 0.3), new THREE.MeshStandardMaterial({ color }));
      rightArm.position.set(0.85, 1.4, 0);
      group.add(rightArm);

      const leftLeg = new THREE.Mesh(new THREE.BoxGeometry(0.4, 1.5, 0.4), new THREE.MeshStandardMaterial({ color: 0x000000 }));
      leftLeg.position.set(-0.3, 0, 0);
      group.add(leftLeg);

      const rightLeg = new THREE.Mesh(new THREE.BoxGeometry(0.4, 1.5, 0.4), new THREE.MeshStandardMaterial({ color: 0x000000 }));
      rightLeg.position.set(0.3, 0, 0);
      group.add(rightLeg);

      // Add health bar -- health integration
      group.health = 100;
      createHealthBar(group);
      updateHealthBar(group);

      return group;
    }

    const player = createPlayer();
    scene.add(player);

    // Other players group container
    const otherPlayersGroup = new THREE.Group();
    scene.add(otherPlayersGroup);

    // Keyboard controls
    const keys = {};
    document.addEventListener('keydown', e => keys[e.key.toLowerCase()] = true);
    document.addEventListener('keyup', e => keys[e.key.toLowerCase()] = false);

    let velocity = new THREE.Vector3();
    let direction = new THREE.Vector3();
    const speed = 0.1;

    // Raycaster for ground collision
    const raycaster = new THREE.Raycaster();
    let canJump = false;
    let yVelocity = 0;

    function updatePlayer() {
      // Movement input
      direction.set(0, 0, 0);
      if (keys['w']) direction.z -= 1;
      if (keys['s']) direction.z += 1;
      if (keys['a']) direction.x -= 1;
      if (keys['d']) direction.x += 1;
      direction.normalize();

      // Apply movement relative to camera rotation
      const angle = camera.rotation.y;
      const moveX = direction.x * Math.cos(angle) - direction.z * Math.sin(angle);
      const moveZ = direction.x * Math.sin(angle) + direction.z * Math.cos(angle);

      velocity.x = moveX * speed;
      velocity.z = moveZ * speed;

      // Gravity & jumping
      yVelocity -= 0.01; // gravity
      raycaster.set(player.position.clone().add(new THREE.Vector3(0, 0.1, 0)), new THREE.Vector3(0, -1, 0));
      const intersects = raycaster.intersectObjects(platforms);
      if (intersects.length > 0 && intersects[0].distance < 1.6) {
        yVelocity = Math.max(0, yVelocity);
        canJump = true;
      } else {
        canJump = false;
      }

      if (keys[' '] && canJump) {
        yVelocity = 0.2;
      }

      player.position.x += velocity.x;
      player.position.z += velocity.z;
      player.position.y += yVelocity;
      if (player.position.y < 1) {
        player.position.y = 1;
        yVelocity = 0;
        canJump = true;
      }

      // Collisions with kill bricks
      for (const brick of killBricks) {
        const distance = player.position.distanceTo(brick.position);
        if (distance < 1.5) {
          player.health -= 1;
          if (player.health < 0) player.health = 0;
          updateHealthBar(player);
        }
      }

      // Update health in Firebase -- health integration
      playerRef.update({
        x: player.position.x,
        y: player.position.y,
        z: player.position.z,
        health: player.health
      });

      // If player health zero, respawn at origin
      if (player.health <= 0) {
        player.position.set(0, 1, 0);
        player.health = 100;
        updateHealthBar(player);
        playerRef.update({ health: player.health });
      }
    }

    // Listen for other players data changes
    db.ref('players').on('value', snapshot => {
      const players = snapshot.val() || {};
      // Remove players that left
      for (const id in otherPlayers) {
        if (!(id in players)) {
          otherPlayersGroup.remove(otherPlayers[id]);
          delete otherPlayers[id];
        }
      }
      for (const id in players) {
        if (id === playerId) continue;
        if (!(id in otherPlayers)) {
          const newPlayer = createPlayer(0xff0000);
          otherPlayers[id] = newPlayer;
          otherPlayersGroup.add(newPlayer);
        }
        const data = players[id];
        const op = otherPlayers[id];
        op.position.set(data.x, data.y, data.z);
        if (op.health !== data.health) {
          op.health = data.health;
          updateHealthBar(op);
        }
      }
    });

    camera.position.set(0, 5, 10);

    function animate() {
      requestAnimationFrame(animate);
      updatePlayer();
      updateBullets();

      // Camera follow
      camera.position.lerp(new THREE.Vector3(player.position.x, player.position.y + zoomDistance, player.position.z + zoomDistance), 0.1);
      camera.lookAt(player.position);

      renderer.render(scene, camera);
    }

    animate();

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth/window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
  </script>
</body>
</html>
