    function enc(screenName, pss){
      let npss="";
      for (let i=0; i<screenName.length; i++){
        let N = screenName.charCodeAt(i);
          for (let l=0; l<pss.length; l++){
            let M = pss.charCodeAt(l);
              npss+=String.fromCharCode(N^M);
          }
          pss=npss;
          npss="";
        
      }
      return pss;
    }

    const otherPlayers = {};
    class Bullet {
        constructor(position, direction) {
            const geometry = new THREE.SphereGeometry(0.1, 8, 8);
            const material = new THREE.MeshStandardMaterial({ color: 0xffff00 });
            this.mesh = new THREE.Mesh(geometry, material);
            this.mesh.position.copy(position);
            this.velocity = direction.clone().multiplyScalar(0.5);
            scene.add(this.mesh);
        }

        update() {
            this.mesh.position.add(this.velocity);
        }
    }

    function makePlatform(x, y, z, height, width, depth, scene, platformList, color=0x00ff00) {
        const platform = new THREE.Mesh(
            new THREE.BoxGeometry(width, depth, height),
            new THREE.MeshStandardMaterial({ color: color })
        );
        platform.position.set(x, z, y);
        // platform.castShadow=true;
        // platform.receiveShadow=true;
        scene.add(platform);
        platformList.push(platform);
    }
    
    function makeTorus(x, y, z, radius, tube, radialSegments, tubularSegments, scene, list, color=0x000dff){
      const shape = new THREE.Mesh(
            new THREE.TorusGeometry(radius, tube, radialSegments, tubularSegments),
            new THREE.MeshStandardMaterial({ color: color })
        );
      shape.position.set(x, z, y);
      shape.rotation.x=Math.PI/2;
      scene.add(shape);
      list.push(shape);
    }
    function makeCircle(x, y, z, radius, scene, list, color=0x000dff) {
      const shape = new THREE.Mesh(
            new THREE.CylinderGeometry(radius, radius, 0.1),
            new THREE.MeshStandardMaterial({ color: color })
        );
      shape.position.set(x, z, y);
      // shape.rotation.x=Math.PI/2;
      scene.add(shape);
      list.push(shape);
    }
    const ladders = [];
    function makeCylinder(x, y, z, radius, height, scene, list, color=0x000dff) {
      const shape = new THREE.Mesh(
        new THREE.CylinderGeometry(radius, radius, height),
        new THREE.MeshStandardMaterial({ color:color })
      );
      shape.position.set(x, y, z);
      scene.add(shape);
      list.push(shape);
    }
    function makeLadder(x, y, z, height = 5, spacing = 0.5) {
      const ladderGroup = new THREE.Group();
    
      for (let i = 0; i < height; i++) {
        const step = new THREE.Mesh(
          new THREE.BoxGeometry(0.8, 0.1, 0.1),
          new THREE.MeshStandardMaterial({ color: 0x8b4513 })
        );
        step.castShadow = true;
        step.receiveShadow = true;
        step.position.set(x, y + i * spacing, z);
        ladderGroup.add(step);
      }
    
      ladderGroup.userData.isLadder = true;
      ladderGroup.position.set(x, y, z);
      scene.add(ladderGroup);
      ladders.push(ladderGroup);
    }


    let zoomDistance = 6;
    const scene = new THREE.Scene();

    const platforms = [];

    const bullets = [];
    function createNameTag(name) {
      const canvas = document.createElement('canvas');
      const context = canvas.getContext('2d');
      canvas.width = 256;
      canvas.height = 64;

      context.fillStyle = 'white';
      context.fillRect(0, 0, canvas.width, canvas.height);
      context.fillStyle = 'black';
      context.font = '24px Arial';
      context.textAlign = 'center';
      context.fillText(name, canvas.width / 2, canvas.height / 2 + 8);

      const texture = new THREE.CanvasTexture(canvas);
      const material = new THREE.SpriteMaterial({ map: texture });
      const sprite = new THREE.Sprite(material);
      sprite.scale.set(2, 0.5, 1); // Adjust size
      sprite.position.y = 3; // Position above the avatar's head
      return sprite;
    }

    document.addEventListener('mousedown', () => {
        const direction = new THREE.Vector3();
        camera.getWorldDirection(direction);
        const position = player.position.clone().add(new THREE.Vector3(0, 1.5, 0)); // Adjust as needed
        bullets.push(new Bullet(position, direction));
    });
    function updateBullets() {
        bullets.forEach((bullet, index) => {
            bullet.update();
            // Remove bullets that are too far
            if (bullet.mesh.position.length() > 100) {
            scene.remove(bullet.mesh);
            bullets.splice(index, 1);
            }
        });
    }
    function createHealthBar(player) {
        const canvas = document.createElement('canvas');
        canvas.width = 128;
        canvas.height = 16;
        const context = canvas.getContext('2d');
        context.fillStyle = 'green';
        context.fillRect(0, 0, 128, 16);
        const texture = new THREE.CanvasTexture(canvas);
        const material = new THREE.SpriteMaterial({ map: texture });
        const sprite = new THREE.Sprite(material);
        sprite.scale.set(2, 0.25, 1);
        sprite.position.set(0, 2.5, 0); // Position above the player's head
        player.add(sprite);
        player.healthBar = { sprite, context, texture };
    }
    function updateHealthBar(player) {
        const { context, texture } = player.healthBar;
        context.clearRect(0, 0, 128, 16);
        context.fillStyle = 'red';
        context.fillRect(0, 0, 128, 16);
        context.fillStyle = 'green';
        context.fillRect(0, 0, (player.health / 100) * 128, 16);
        texture.needsUpdate = true;
        // playerRef.update({health:player.health});
    }
    let climbing = false;

    function checkLadderClimb() {
      climbing = false;
      for (const ladder of ladders) {
        const dist = player.position.distanceTo((ladder.position)*2);
        if (dist < 1.5) {
          if (keys['w']) {
            velocityY = 0.05; // smooth upward climb
            climbing = true;
          } else {
            velocityY=0;
          }
          break; // Only climb one ladder at a time
        }
      }
    }

    function createDetailedGun() {
      const gun = new THREE.Group();

      const body = new THREE.Mesh(
        new THREE.BoxGeometry(0.2, 0.2, 1),
        new THREE.MeshStandardMaterial({ color: 0x333333 })
      );
      // body.castShadow = true;
      // body.receiveShadow = true;
      gun.add(body);

      const grip = new THREE.Mesh(
        new THREE.BoxGeometry(0.15, 0.4, 0.2),
        new THREE.MeshStandardMaterial({ color: 0x222222 })
      );
      grip.position.set(0, -0.3, -0.3);
      // grip.castShadow = true;
      // grip.receiveShadow = true;
      gun.add(grip);

      const barrel = new THREE.Mesh(
        new THREE.CylinderGeometry(0.05, 0.05, 0.6, 16),
        new THREE.MeshStandardMaterial({ color: 0x111111 })
      );
      barrel.rotation.x = Math.PI / 2;
      barrel.position.set(0, 0.05, 0.5);
      // barrel.castShadow = true;
      // barrel.receiveShadow = true;
      gun.add(barrel);
      gun.rotation.y=Math.PI;
      return gun;
    }
    function createPlayer(color = 0x0077ff, admin=false) {
      const group = new THREE.Group();
      const gun = createDetailedGun();
      gun.position.set(0.5, 1, -0.6); // Adjust as needed
      group.add(gun);
      const torso = new THREE.Mesh(new THREE.BoxGeometry(1, 1.5, 0.5), new THREE.MeshStandardMaterial({ color }));
      torso.position.y = 1.5;
      // torso.castShadow=true;
      // torso.receiveShadow=true;
      group.add(torso);

      const head = new THREE.Mesh(new THREE.BoxGeometry(0.6, 0.6, 0.6), new THREE.MeshStandardMaterial({ color: 0xffcc99 }));
      head.position.y = 2.4;
      // head.castShadow=true;
      // head.receiveShadow=true;
      group.add(head);

      const armMaterial = new THREE.MeshStandardMaterial({ color });
      const leftArm = new THREE.Mesh(new THREE.BoxGeometry(0.3, 1.2, 0.3), armMaterial);
      const rightArm = leftArm.clone();
      // leftArm.castShadow=true;
      // leftArm.receiveShadow=true;
      // rightArm.castShadow=true;
      // rightArm.receiveShadow=true;
      leftArm.position.set(-0.65, 1.5, 0);
      rightArm.position.set(0.65, 1.5, 0);
      group.add(leftArm, rightArm);

      const legMaterial = new THREE.MeshStandardMaterial({ color: 0x333333 });
      const leftLeg = new THREE.Mesh(new THREE.BoxGeometry(0.4, 2.3, 0.4), legMaterial);
      const rightLeg = leftLeg.clone();
      // leftLeg.castShadow=true;
      // leftLeg.receiveShadow=true;
      // rightLeg.castShadow=true;
      // rightLeg.receiveShadow=true;
      leftLeg.position.set(-0.3, 0.3, 0);
      rightLeg.position.set(0.3, 0.3, 0);
      group.add(leftLeg, rightLeg);
      if(admin===false){
        group.scale.set(0.6, 0.6, 0.6);
      }
      
      group.userData = { leftArm, rightArm, leftLeg, rightLeg, walkTime: 0 };

      return group;
    }

    const player = createPlayer();
    player.position.set(0, 0, 0);
    scene.add(player);

    // Initialize player health here (added fix)
    let velocityY = 0;
    let onGround = false;
    player.health = 100;
    let yaw = 0;
    let pitch = 0;
    createHealthBar(player);
    updateHealthBar(player);

    let velocity = new THREE.Vector3();
    const keys = {};
    document.addEventListener('keydown', e => keys[e.key.toLowerCase()] = true);
    document.addEventListener('keyup', e => keys[e.key.toLowerCase()] = false);
    document.body.addEventListener('click', () => {
      renderer.domElement.requestPointerLock();
    });

    document.addEventListener('pointerlockchange', () => {
      if (document.pointerLockElement === renderer.domElement) {
        document.addEventListener('mousemove', onMouseMove, false);
      } else {
        document.removeEventListener('mousemove', onMouseMove, false);
      }
    });
    let startX, startY;
    document.addEventListener('touchstart', (e)=>{
      startX=e.touches[0].clientX;
      startY=e.touches[0].clientY;
    });

    document.addEventListener('touchmove', onTouchMove, false);
    function onMouseMove(event) {
      const movementX = event.movementX || 0;
      const movementY = event.movementY || 0;
      yaw -= movementX * 0.002;
      pitch -= movementY * 0.002;
      pitch = Math.max(-Math.PI / 2 + 0.1, Math.min(Math.PI / 2 - 0.1, pitch));
    }
    function onTouchMove(event) {
      const nowX = event.touches[0].clientX || 0;
      const nowY = event.touches[0].clientY || 0;
      const movementX=nowX-startX;
      const movementY=nowY-startY;
      startX=nowX;
      startY=nowY;
      yaw -= movementX * 0.002;
      pitch -= movementY * 0.002;
      pitch = Math.max(-Math.PI / 2 + 0.1, Math.min(Math.PI / 2 - 0.1, pitch));
    }
    window.addEventListener('keydown', (event) => {
      if (event.key.toLowerCase() === 't' && admin) {
        const targetName = prompt("Enter the screen name of the player to teleport to:");
        if (!targetName) return;

        db.ref('players').once('value').then(snapshot => {
          const players = snapshot.val() || {};
          let found = false;

          for (const id in players) {
            const pdata = players[id];
            if (pdata.screenName?.toLowerCase() === targetName.toLowerCase()) {
              // Found the target
              player.position.set(pdata.x, pdata.y, pdata.z);
              db.ref('players/' + playerId).update({
                x: pdata.x,
                y: pdata.y,
                z: pdata.z
              });
              found = true;
              break;
            }
          }

          if (!found) {
            alert("Player with that screen name not found.");
          }
        });
      }
      if (event.key.toLowerCase() === 'c'){
        for (const id in otherPlayers) {
          db.ref('players').remove();
          scene.remove(otherPlayers[id]);
          delete otherPlayers[id];
        }
      }
    });

    document.addEventListener('wheel', (event) => {
      zoomDistance += event.deltaY * 0.01;
      zoomDistance = Math.max(0, Math.min(25, zoomDistance));
    });
    let lastHealth = player.health;
    let alrTd=false;
    const crosshair = document.getElementById('crosshair');
    var standingPlatform = null;
    function animate() {
        requestAnimationFrame(animate);

        const direction = new THREE.Vector3();
        const speed = 0.1;

        if (keys['w']&&!climbing) direction.z -= 1;
        if (keys['s']) direction.z += 1;
        if (keys['a']) direction.x -= 1;
        if (keys['d']) direction.x += 1;
        checkLadderClimb();
        if (keys['arrowleft']) {
          yaw += 15 * 0.002;
        }
        if (keys['arrowright']) {
          yaw-=15*0.002
        }
        if (keys['arrowup']) {
          direction.z -= 1;
        }
        if (keys['arrowdown']) {
          direction.z += 1;
        }
        direction.applyEuler(new THREE.Euler(0, yaw + Math.PI, 0));
        direction.normalize();
        if (!climbing){
          velocityY -= 0.01; // gravity always applies
        }
        player.position.y += velocityY;

        for (const p of platforms) {
            const halfWidth = p.geometry.parameters.width / 2;
            const halfDepth = p.geometry.parameters.depth / 2;
            const halfHeight = p.geometry.parameters.height / 2;
            const px = p.position.x, pz = p.position.z, py = p.position.y;

            const overX = Math.abs(player.position.x - px) < halfWidth;
            const overZ = Math.abs(player.position.z - pz) < halfDepth;
            const overY = Math.abs(player.position.y - p.position.y) < p.geometry.parameters.height * 2;
            const platformTopY = py + halfHeight;
            const platformBottomY = py - halfHeight;
            const playerTop = player.position.y + 1.0;
            const playerBottom = player.position.y;

            // Falling: check landing on top
            if (velocityY <= 0 && overX && overZ && overY) {
            player.position.y = p.position.y+0.75;
            velocityY = 0;
            onGround = true;
            standingPlatform = p;
            break;
            }

            // Jumping up: check hitting bottom
            if (velocityY > 0 && overX && overZ && playerTop > platformBottomY - 0.2 && playerTop < platformBottomY + 0.2) {
            player.position.y = platformBottomY - 1.0;
            velocityY = -0.01; // start falling
            }
        }

        // Horizontal collision
        const proposedX = player.position.x + direction.x * speed;
        const proposedZ = player.position.z + direction.z * speed;
        const playerY = player.position.y;

        let canMoveX = true;
        let canMoveZ = true;

        for (const p of platforms) {
            if (p === standingPlatform) continue;

            const halfWidth = p.geometry.parameters.width / 2;
            const halfDepth = p.geometry.parameters.depth / 2;
            const halfHeight = p.geometry.parameters.height / 2;
            const px = p.position.x;
            const pz = p.position.z;
            const py = p.position.y;

            const verticalOverlap = playerY + 0.9 > py - halfHeight && playerY < py + halfHeight + 0.9;

            if (verticalOverlap) {
            if (
                Math.abs(proposedX - px) < halfWidth + 0.3 &&
                Math.abs(player.position.z - pz) < halfDepth + 0.3
            ) canMoveX = false;

            if (
                Math.abs(player.position.x - px) < halfWidth + 0.3 &&
                Math.abs(proposedZ - pz) < halfDepth + 0.3
            ) canMoveZ = false;
            }
        }

        for (const p of bouncers) {
            const px = Math.abs(player.position.x - p.position.x) < p.geometry.parameters.width / 2;
            const pz = Math.abs(player.position.z - p.position.z) < p.geometry.parameters.depth / 2;
            const py = Math.abs(player.position.y - p.position.y) < p.geometry.parameters.height * 2;
            if (px && pz && py && velocityY < 0) velocityY = 10;
        }
        markers.forEach(p => {
            if (((Math.sqrt((p.position.x-proposedX)**2 + (p.position.z-proposedZ)**2))<1)&&(player.position.y > p.position.y+p.geometry.parameters.height*0.5)&&(velocityY<=0)&&((standingPlatform!=p)||(onGround==true))) {
              player.position.y = p.position.y+p.geometry.parameters.height*0.5+0.5;
              velocityY = 0;
              onGround = true;
              standingPlatform = p;
              if (markersFound.includes("Obby Marker")){
                
              } else {
                alert("You found Obby Marker!");
                markersFound.push("Obby Marker");
              }
            }
            if (((Math.sqrt((p.position.x-proposedX)**2 + (p.position.z-proposedZ)**2))<1)&&(player.position.y < p.position.y+p.geometry.parameters.height*0.5)&&(standingPlatform!=p)){
              canMoveX=false;
              canMoveZ=false;
              if (markersFound.includes("Obby Marker")){
                
              } else {
                alert("You found Obby Marker!");
                markersFound.push("Obby Marker");
              }
            }

        });

        if (canMoveX) player.position.x = proposedX;
        if (canMoveZ) player.position.z = proposedZ;

        // Kill bricks
        killBricks.forEach(p => {
            const px = Math.abs(player.position.x - p.position.x) < p.geometry.parameters.width / 2;
            const pz = Math.abs(player.position.z - p.position.z) < p.geometry.parameters.depth / 2;
            const py = Math.abs(player.position.y - p.position.y) < p.geometry.parameters.height * 2;
            if (px && pz && py) {
            velocityY = 0;
            player.position.set(0, 0, 0);
            onGround = true;
            }
        });

        if (keys[' '] && onGround) {
          velocityY = 0.22;
          if (admin!=true){
            onGround = false;
          }
          // if(admin){
          //   for (const id in otherPlayers) {
          //     const other = otherPlayers[id];
          //     if (typeof other.health === 'undefined') other.health = 100;
          //     other.health -= 30;
          //     updateHealthBar(other);
          //     db.ref('players/' + id).update({health:other.health});
                
          //   }
          // }
        }

        const lookDirection = new THREE.Vector3(
        Math.sin(yaw) * Math.cos(pitch),
        Math.sin(pitch),
        Math.cos(yaw) * Math.cos(pitch)
        );

        // Player should face the same direction as camera
        player.rotation.y = yaw + Math.PI;


        const isFirstPerson = zoomDistance < 2;

        if (isFirstPerson) {
          crosshair.style.display='block';
          const eyeOffset = new THREE.Vector3(0, 1.7, 0);
          const cameraPosition = player.position.clone().add(eyeOffset);
          camera.position.copy(cameraPosition);
          camera.lookAt(cameraPosition.clone().add(lookDirection));

          // Hide body in first-person
          player.traverse(child => {
              if (child.isMesh) child.visible = false;
          });

        } else {
          crosshair.style.display='none';
          const cameraPosition = player.position.clone().sub(lookDirection.clone().multiplyScalar(zoomDistance));
          cameraPosition.y += 2;
          camera.position.copy(cameraPosition);
          camera.lookAt(player.position.clone().add(new THREE.Vector3(0, 1, 0)));

          // Show body in third-person
          player.traverse(child => {
              if (child.isMesh) child.visible = true;
          });
        }



        const isMoving = direction.lengthSq() > 0.0001;
        if (isMoving) player.userData.walkTime += 0.2;
        else player.userData.walkTime = 0;

        const swing = Math.sin(player.userData.walkTime) * 0.5;
        player.userData.leftArm.rotation.x = swing;
        player.userData.rightArm.rotation.x = -swing;
        player.userData.leftLeg.rotation.x = -swing;
        player.userData.rightLeg.rotation.x = swing;


        // Update bullets positions
        updateBullets();

        // Collision between bullets and other players or self
        bullets.forEach((bullet, bulletIndex) => {
            // Check collision with other players
            for (const id in otherPlayers) {
            const other = otherPlayers[id];
              if (bullet.mesh.position.distanceTo(other.position) < 1) {
                // Decrease health of other player on hit
                if (typeof other.health === 'undefined') other.health = 100; // safety check
                other.health -= 10;
                updateHealthBar(other);
                // Remove bullet
                scene.remove(bullet.mesh);
                bullets.splice(bulletIndex, 1);
                db.ref('players/' + id).update({health:other.health});
                break;
              }
            }
            // Check collision with local player (friendly fire possible)
            if (bullet.mesh.position.distanceTo(player.position) < 1) {
                player.health -= 10;
                if (player.health <= 0){
                  player.health=100;
                  player.position.set(0, 0, 0);
                  onGround=True;
                }
                updateHealthBar(player);
                scene.remove(bullet.mesh);
                bullets.splice(bulletIndex, 1);
            }
        });
        if (player.health <= 0){
          player.health=100;
          player.position.set(0, 0, 0);
          onGround=True;
        }

        renderer.render(scene, camera);

        // Update local player position in Firebase
        if (player.health !== lastHealth) {
            playerRef.update({
                x: player.position.x,
                y: player.position.y,
                z: player.position.z,
                health: player.health
            });
            lastHealth = player.health;
        } else {
            playerRef.update({
                x: player.position.x,
                y: player.position.y,
                z: player.position.z
                // health: player.health
            });
        }

    }
let admin = null;
playerRef.child("admin").on("value", snapshot => {
  admin = snapshot.val();
  if (admin !=null) {
    animate();
  }
});
 db.ref('players').on('value', snapshot => {
  const data = snapshot.val() || {};
  for (const id in data) {
    const pdata = data[id];
    if (id === playerId) {
      player.position.set(pdata.x, pdata.y, pdata.z);
      if (typeof pdata.health === 'number') {
        player.health = pdata.health;
        updateHealthBar(player);
      }
      // Do NOT overwrite player.health here to avoid losing local health changes
    } else {
      // For other players, update position and health fully from Firebase
      if (!otherPlayers[id]) {
        const newPlayer = createPlayer(0xff0000, pdata.admin||false);
        newPlayer.health = pdata.health ?? 100;
        createHealthBar(newPlayer);
        updateHealthBar(newPlayer);

        const nameTag = createNameTag(pdata.screenName || 'Player');
        nameTag.name = 'nameTag'; // set identifiable name
        newPlayer.add(nameTag);

        scene.add(newPlayer);
        otherPlayers[id] = newPlayer;
      }

      const other = otherPlayers[id];
      other.position.set(pdata.x, pdata.y, pdata.z);

      // Update name tag text only if it changed
      const existingTag = other.getObjectByName('nameTag');
      if (existingTag && existingTag.element && existingTag.element.innerText !== pdata.screenName) {
        existingTag.element.innerText = pdata.screenName || 'Player';
      }

      if (typeof pdata.health === 'number') {
        other.health = pdata.health;
        updateHealthBar(other);
      }

    }
  }

  // Remove disconnected players...

      // Remove players who left
      for (const id in otherPlayers) {
        if (!data[id]) {
          scene.remove(otherPlayers[id]);
          delete otherPlayers[id];
        }
      }
    });
  </script>
