    function makePlatform(x, y, z, height, width, depth, scene, platformList, color = 0x00ff00, opacity = 1.0, rotx = 0, roty = 0, rotz = 0) {
        const loader = new THREE.TextureLoader();
        let imagePath;
        if(color === 0x00ff00) {
          imagePath = 'download.jpeg' ;
        }else if (color === 0x737373) {
          imagePath = 'rocks.jpeg';
        }else if (color === 0x00fff7){
          imagePath = 'portal.jpeg';
        }else{
          imagePath='studs.jpeg';
        }
        loader.load(imagePath, (baseTexture) => {
            // Set wrapping mode to repeat
            baseTexture.wrapS = THREE.RepeatWrapping;
            baseTexture.wrapT = THREE.RepeatWrapping;

            // Correctly map your variables to Three.js's standard BoxGeometry dimensions
            const boxWidth = width;   // Mapped to X-axis
            const boxHeight = depth;  // Mapped to Y-axis
            const boxDepth = height;  // Mapped to Z-axis

            // Define a desired texture scale (e.g., how many units per repeat)
            const textureScale = 2; // This means one texture tile will be 2x2 units

            // Calculate repeat values for each face based on its dimensions and the desired texture scale
            const faceSizes = [
                [boxDepth, boxHeight], // Right side (+X) -> depth by height
                [boxDepth, boxHeight], // Left side (-X) -> depth by height
                [boxWidth, boxDepth],  // Top side (+Y) -> width by depth
                [boxWidth, boxDepth],  // Bottom side (-Y) -> width by depth
                [boxWidth, boxHeight], // Front side (+Z) -> width by height
                [boxWidth, boxHeight], // Back side (-Z) -> width by height
            ];

            const materials = faceSizes.map(([fw, fh]) => {
                const tex = baseTexture.clone();
                
                // Dynamically calculate the repeat values for each face
                tex.repeat.set(fw / textureScale, fh / textureScale);

                return new THREE.MeshStandardMaterial({
                    color: color,
                    transparent: opacity < 1,
                    opacity: opacity,
                    map: tex
                });
            });

            const platform = new THREE.Mesh(
                new THREE.BoxGeometry(boxWidth, boxHeight, boxDepth),
                materials
            );

            // Map your position and rotation variables to Three.js's standard axes
            platform.position.set(x, z, y);
            platform.rotation.x = rotx;
            platform.rotation.y = rotz;
            platform.rotation.z = roty;

            scene.add(platform);
            platformList.push(platform);
        });

          //   camera.lookAt(car.position.clone().add(new THREE.Vector3(0, 1, 0)));
          // }
        }



        const isMoving = direction.lengthSq() > 0.0001;
        if (isMoving) player.userData.walkTime += 0.2;
        else player.userData.walkTime = 0;

        const swing = Math.sin(player.userData.walkTime) * 0.5;
        player.userData.leftArm.rotation.x = swing;
        player.userData.rightArm.rotation.x = -swing;
        player.userData.leftLeg.rotation.x = -swing;
        player.userData.rightLeg.rotation.x = swing;


        // Update bullets positions
        updateBullets();

        // Collision between bullets and other players or self
        bullets.forEach((bullet, bulletIndex) => {
            // Check collision with other players
            let bboxBullet = new THREE.Box3().setFromObject(bullet.mesh);
            for (const id in otherPlayers) {
            const other = otherPlayers[id];
              if (bullet.mesh.position.distanceTo(other.position) < 1) {
                // Decrease health of other player on hit
                if (typeof other.health === 'undefined') other.health = 100; // safety check
                other.health -= 10;
                updateHealthBar(other);
                // Remove bullet
                scene.remove(bullet.mesh);
                bullets.splice(bulletIndex, 1);
                db.ref('players/' + id).update({health:other.health});
                break;
              }
            }
            // Check collision with local player (friendly fire possible)
            if (bullet.mesh.position.distanceTo(player.position) < 1) {
                player.health -= 10;
                if (player.health <= 0){
                  player.health=100;
                  player.position.set(0, 3, 0);
                  onGround=true;
                }
                updateHealthBar(player);
                scene.remove(bullet.mesh);
                bullets.splice(bulletIndex, 1);
            }

            for (const p of platforms){
              let bboxplat = new THREE.Box3().setFromObject(p);
              if (bboxBullet.intersectsBox(bboxplat)){
                scene.remove(bullet.mesh);
                bullets.splice(bulletIndex, 1);
                break;
              }
            }

        });
        if (player.health <= 0){
          player.health=100;
          player.position.set(0, 3, 0);
          onGround=true;
        }

        renderer.render(scene, camera);

        // Update local player position in Firebase
        if (player.health !== lastHealth) {
            playerRef.update({
                x: player.position.x,
                y: player.position.y,
                z: player.position.z,
                health: player.health,
            });
            lastHealth = player.health;
        } else {
            playerRef.update({
                x: player.position.x,
                y: player.position.y,
                z: player.position.z,
                // health: player.health
            });
        }

    }

function checkStart() {
  if (!started && admin != null && auth === true) {
    let ipGood = false;
    playerRef.child("ip").once('value')
      .then((snapshot)=>{
        if(snapshot.exists()){
          fetch('https://api.ipify.org?format=json')
            .then(res => res.json())
            .then(data => {
              if (data.ip == snapshot.val()){
                started = true;
                document.getElementById('loginContainer').style.display='none';
                animate();
              } else {alert("Bad IP");}
            });
        }
      });
  } else if (auth === false && !started) {
    alert("Incorrect username or password. If you created an account, your username is already taken.");
  }
}
