    class Bullet {
        constructor(position, direction) {
            const geometry = new THREE.SphereGeometry(0.1, 8, 8);
            const material = new THREE.MeshStandardMaterial({ color: 0xffff00 });
            this.mesh = new THREE.Mesh(geometry, material);
            this.mesh.position.copy(position);
            this.velocity = direction.clone().multiplyScalar(0.5);
            scene.add(this.mesh);
        }

        update() {
            this.mesh.position.add(this.velocity);
        }
    }

    function makePlatform(x, y, z, height, width, depth, scene, platformList, color = 0x00ff00, opacity = 1.0, rotx = 0, roty = 0, rotz = 0, ret = false) {
        const loader = new THREE.TextureLoader();
        let imagePath;
        if(color === 0x00ff00) {
          imagePath = 'download.jpeg' ;
        }else if (color === 0x737373) {
          imagePath = 'rocks.jpeg';
        }else if (color === 0x00fff7){
          imagePath= 'portal.jpeg';
        }else{
          imagePath='studs.jpeg';
        }
        loader.load(imagePath, (baseTexture) => {
            // Set wrapping mode to repeat
            baseTexture.wrapS = THREE.RepeatWrapping;
            baseTexture.wrapT = THREE.RepeatWrapping;

            // Correctly map your variables to Three.js's standard BoxGeometry dimensions
            const boxWidth = width;   // Mapped to X-axis
            const boxHeight = depth;  // Mapped to Y-axis
            const boxDepth = height;  // Mapped to Z-axis

            // Define a desired texture scale (e.g., how many units per repeat)
            const textureScale = 2; // This means one texture tile will be 2x2 units

            // Calculate repeat values for each face based on its dimensions and the desired texture scale
            const faceSizes = [
                [boxDepth, boxHeight], // Right side (+X) -> depth by height
                [boxDepth, boxHeight], // Left side (-X) -> depth by height
                [boxWidth, boxDepth],  // Top side (+Y) -> width by depth
                [boxWidth, boxDepth],  // Bottom side (-Y) -> width by depth
                [boxWidth, boxHeight], // Front side (+Z) -> width by height
                [boxWidth, boxHeight], // Back side (-Z) -> width by height
            ];

            const materials = faceSizes.map(([fw, fh]) => {
                const tex = baseTexture.clone();
                
                // Dynamically calculate the repeat values for each face
                tex.repeat.set(fw / textureScale, fh / textureScale);

                return new THREE.MeshStandardMaterial({
                    color: color,
                    transparent: opacity < 1,
                    opacity: opacity,
                    map: tex
                });
            });

            const platform = new THREE.Mesh(
                new THREE.BoxGeometry(boxWidth, boxHeight, boxDepth),
                materials
            );

            // Map your position and rotation variables to Three.js's standard axes
            platform.position.set(x, z, y);
            platform.rotation.x = rotx;
            platform.rotation.y = rotz;
            platform.rotation.z = roty;

            scene.add(platform);
            if (!ret){
              platformList.push(platform);
            } else {
              return platform;
            }
        });
    }

    function createNameTag(name) {
      const canvas = document.createElement('canvas');
      const context = canvas.getContext('2d');
      canvas.width = 256;
      canvas.height = 64;

      context.fillStyle = 'white';
      context.fillRect(0, 0, canvas.width, canvas.height);
      context.fillStyle = 'black';
      context.font = '24px Arial';
      context.textAlign = 'center';
      context.fillText(name, canvas.width / 2, canvas.height / 2 + 8);

      const texture = new THREE.CanvasTexture(canvas);
      const material = new THREE.SpriteMaterial({ map: texture });
      const sprite = new THREE.Sprite(material);
      sprite.scale.set(2, 0.5, 1); // Adjust size
      sprite.position.y = 3; // Position above the avatar's head
      return sprite;
    }

    function updateBotX(bot, player, speed) {
      // Vector from bot → player
      const toPlayer = new THREE.Vector3().subVectors(player.position, bot.position);

      // Flatten to XZ plane (ignore vertical difference if you want ground movement only)
      toPlayer.y = 0;
      toPlayer.normalize();

      // Move bot toward player
      // bot.position.add(toPlayer.multiplyScalar(speed));
      bot.position.x+=toPlayer.x*speed;

      // Make bot face player (rotate toward player)
      bot.lookAt(player.position.x, bot.position.y, player.position.z);
    }
    function updateBotZ(bot, player, speed) {
      // Vector from bot → player
      const toPlayer = new THREE.Vector3().subVectors(player.position, bot.position);

      // Flatten to XZ plane (ignore vertical difference if you want ground movement only)
      toPlayer.y = 0;
      toPlayer.normalize();

      // Move bot toward player
      // bot.position.add(toPlayer.multiplyScalar(speed));
      bot.position.z+=toPlayer.z*speed;

      // Make bot face player (rotate toward player)
      bot.lookAt(player.position.x, bot.position.y, player.position.z);
    }

  checkStart();
});

db.ref('lightning').on('value', snapshot => {
  const data = snapshot.val() || {};
  for (const id in data) {
    if (!lightnings[id]) {
      lightnings[id]=[];
      for (let i = 0; i < 20; i+=2){
        makePlatform(data[id].x, data[id].z, 3+(2.598076211*i), 0.5, 0.5, 3, scene, lightnings[id], 0xfcfc03, 1.0, -Math.PI/6);
        makePlatform(data[id].x, data[id].z, 3+(2.598076211*(i+1)), 0.5, 0.5, 3, scene, lightnings[id], 0xfcfc03, 1.0, Math.PI/6);
      }
    }
  }

  for (const id in lightnings) {
    if (!data[id]){
      for (const lin of lightnings[id]) {
        scene.remove(lin);
      }
      delete lightnings[id];
    }
  }
});

function checkStart() {
  if (!started && admin != null && auth === true) {
    let ipGood = false;
    playerRef.child("ip").once('value')
      .then((snapshot)=>{
        if(snapshot.exists()){
          if (localStorage.getItem("fakeIP") == snapshot.val()){
            started = true;
            document.getElementById('loginContainer').style.display='none';
            animate();
          } else {alert("Bad IP");}
        }
      });
  } else if (auth === false && !started) {
    alert("Incorrect username or password. If you created an account, your username is already taken.");
  }
}
 db.ref('players').on('value', snapshot => {
  const data = snapshot.val() || {};
  for (const id in data) {
    const pdata = data[id];
    if (id === playerId) {
      player.position.set(pdata.x, pdata.y, pdata.z);
      if (typeof pdata.health === 'number') {
        player.health = pdata.health;
        updateHealthBar(player);
      }
      // Do NOT overwrite player.health here to avoid losing local health changes
    } else {
      // For other players, update position and health fully from Firebase
      if (!otherPlayers[id]) {
        const newPlayer = createPlayer(0xff0000, pdata.admin||false);
        newPlayer.health = pdata.health ?? 100;
        createHealthBar(newPlayer);
        updateHealthBar(newPlayer);

        const nameTag = createNameTag(pdata.screenName || 'Player');
        nameTag.name = 'nameTag'; // set identifiable name
        newPlayer.add(nameTag);

        scene.add(newPlayer);
        otherPlayers[id] = newPlayer;
      }

      const other = otherPlayers[id];
      other.position.set(pdata.x, pdata.y, pdata.z);

      // Update name tag text only if it changed
      const existingTag = other.getObjectByName('nameTag');
      if (existingTag && existingTag.element && existingTag.element.innerText !== pdata.screenName) {
        existingTag.element.innerText = pdata.screenName || 'Player';
      }

      if (typeof pdata.health === 'number') {
        other.health = pdata.health;
        updateHealthBar(other);
      }

    }
  }

  // Remove disconnected players...

      // Remove players who left
      for (const id in otherPlayers) {
        if (!data[id]) {
          scene.remove(otherPlayers[id]);
          delete otherPlayers[id];
        }
        if (data[id].world='spawn'){
          scene.remove(otherPlayers[id]);
          delete otherPlayers[id];
        }
        
      }
    });
  </script>
